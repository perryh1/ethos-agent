 the loading dock backs onto a residential street, and 2 a.m. operations will be heard.", "a": "Take the full saving — it's compliant, and the company needs it.", "b": "Cap night operations at the loud steps, keeping about $60,000 of the saving."}, "S-29": {"id": "S-29", "stem": "In the leadership meeting, the CEO presents their favored plan and the room is aligning fast. You see a flaw — one that would be expensive to unwind after commitment, and cheap to fix now.", "a": "Raise the flaw now, in the meeting.", "b": "Let the meeting land and raise it with the CEO privately afterward."}, "S-30": {"id": "S-30", "stem": "Your top candidate for a key role has a competing offer expiring tomorrow. Your process has two interviews left — the ones that occasionally catch a mis-hire.", "a": "Make the offer today and skip the remaining rounds.", "b": "Finish the process and accept the risk of losing them."}, "S-31": {"id": "S-31", "stem": "An HR analytics tool can flag likely flight-risk employees from individual email and calendar metadata — volume and timing, not content — so managers can intervene early. It is legal, and two competitors use it.", "a": "Don't enable it — working patterns aren't retention surveillance material.", "b": "Enable it — early warning helps keep good people."}, "S-32": {"id": "S-32", "stem": "Next year's outreach budget can go one of two ways. Option one: performance advertising that reliably converts within the quarter. Option two: a three-year community and education program that builds the company's name but pays back slowly.", "a": "The performance advertising.", "b": "The three-year program."}, "S-33": {"id": "S-33", "stem": "A normally excellent analyst has been slipping for six weeks — a personal situation they briefly shared with you in confidence. Their deliverable anchors this quarter's board pack.", "a": "Quietly reassign the board deliverable and lighten their load while they recover.", "b": "Keep the deliverable with them and hold a clear, kind expectations conversation."}, "S-34": {"id": "S-34", "stem": "The aging conveyor at the heart of your line is down again. Another repair costs $30,000 and reliably buys about a year. A replacement costs $180,000, takes the line down for two weeks, and would run for a decade — but this quarter's numbers are already tight.", "a": "Repair it again and revisit next year.", "b": "Take the two-week hit and replace it now."}, "S-35": {"id": "S-35", "stem": "A major supply contract is up for award. The supplier who has carried you for nine years — including through the industry shortage — is adequate on every current metric. A new bidder is measurably better on quality and delivery, and 12% cheaper.", "a": "Award on this year's measured performance — the new bidder wins.", "b": "Weight the nine years of standing by you — the incumbent keeps it."}, "S-36": {"id": "S-36", "stem": "Exit interviews from two departures point the same direction: a well-liked manager runs their team hot — pressure, weekend messages, no recognition. Nothing formal has been raised by the current team, and no departed employee would be identified either way.", "a": "Put the pattern to the manager directly as formal feedback, on the record.", "b": "Coach the manager informally on workload norms without surfacing the complaints."}, "S-37": {"id": "S-37", "stem": "Your hiring rubric for a technical role requires a completed degree — written in after two senior no-degree hires failed at exactly this level. A candidate is strong in the interviews and the work trial, and references vouch for exactly this work. No degree.", "a": "Hire them — demonstrated ability is the point of the assessments.", "b": "Hold the written requirement and pass — it was written from experience."}, "S-38": {"id": "S-38", "stem": "Launch comms for your next product: engineering's internal plan says March, with real uncertainty. Announcing the March date publicly would energize customers and pressure competitors; announcing \"later this year\" is safe.", "a": "Announce \"later this year.\"", "b": "Commit publicly to March."}, "S-39": {"id": "S-39", "stem": "For a role your company has always filled from one proven industry background, a final-round candidate arrives from a completely different world — equally strong on paper, but nothing like the profile that has always worked here.", "a": "Stay with the proven profile — it has always worked for a reason.", "b": "Take the unconventional candidate and let the mold break."}, "S-40": {"id": "S-40", "stem": "Your published service terms grant outage credits only for claims filed within 72 hours. A sizable customer files at hour 90 for a real outage that genuinely hurt them; the lateness was an internal handoff miss on their side.", "a": "Issue the credit anyway — the outage was real.", "b": "Decline per the published terms, consistently applied."}, "S-41": {"id": "S-41", "stem": "Automation is eliminating the role a nine-year employee has held well. There is a strong severance package ready. There is also an open role they could retrain into over six months — they'd likely be adequate, not great, while an external hire would be excellent.", "a": "Retrain and place them — nine years buys the chance.", "b": "Part with the strong package and hire the best external fit."}, "S-42": {"id": "S-42", "stem": "You are sunsetting your cheapest plan; about 900 small customers must move to one costing $12 more per month. Contracts require 60 days' notice, which is budgeted. Grandfathering their price for 12 months would cost roughly $130,000.", "a": "Fund the 12-month grandfathering.", "b": "Give the contractual 60 days and run the standard migration."}, "V-01": {"id": "V-01", "stem": "Task: notice to customers after a four-hour service outage, now resolved.", "a": "\"We broke something this morning and you felt it — the service was down for four hours. The cause was a config change on our side; it's fixed, and we've added a check so this exact mistake can't recur. Sorry for the disruption.\"", "b": "\"We are writing to inform you of a service interruption experienced this morning, lasting approximately four hours. The issue, caused by an internal configuration change, has been fully resolved, and additional safeguards have been implemented. We apologize for any inconvenience.\""}, "V-02": {"id": "V-02", "stem": "Task: announcement line for a release benchmarked 40% faster across your standard test suite.", "a": "\"In our benchmark suite the new release runs 40% faster; your results will depend on workload — tell us what you measure.\"", "b": "\"The new release is 40% faster. Run your heaviest job and watch the difference.\""}, "V-03": {"id": "V-03", "stem": "Task: weekly status to the executive team on a project that is on track.", "a": "\"Phase 2 is on track for the June 14 date. Budget is holding at plan. One watch item: vendor certification is due June 2 — if it slips, the date moves with it.\"", "b": "\"Phase 2 remains on track for June 14 delivery. Spend to date is $412k against the $430k plan, with the variance driven by deferred hardware. Milestones 4 and 5 closed this week; milestone 6 (vendor certification) is due June 2 and remains the critical path — a slip there moves the delivery date day-for-day. Staffing is stable and no new risks were opened.\""}, "V-04": {"id": "V-04", "stem": "Task: two department updates for the company newsletter, drafted from notes by each team.", "a": "Both updates are edited into the company's one voice — same tone, same structure, interchangeable authorship.", "b": "Each update keeps its team's own voice — ops reads like ops, design reads like design — lightly edited for clarity only."}, "V-05": {"id": "V-05", "stem": "Task: email to a final-round candidate who was not selected.", "a": "\"Thank you for the considerable time you invested in our process. While the panel was impressed by your background, we have selected a candidate whose hands-on scheduling experience more closely aligns with the role's day-to-day requirements. We would welcome your interest in future openings.\"", "b": "\"Thank you for the real time you put into this — it showed. We went with another candidate: the deciding factor was hands-on scheduling experience, which the role leans on daily. If that changes on your side, we'd genuinely like to hear from you again.\""}, "V-06": {"id": "V-06", "stem": "Task: customer-facing answer about when a requested feature will ship.", "a": "\"It ships in the April release.\"", "b": "\"It's currently planned for the April release; timing can shift as we finalize testing.\""}, "V-07": {"id": "V-07", "stem": "Task: internal memo announcing a change to the expense approval process.", "a": "\"From March 1, expenses over $500 require pre-approval from your budget owner. What changes: requests go through the existing tool, approvals are typically same-day, and emergency spend has a retroactive path within 48 hours. What doesn't change: under-$500 spend, card limits, and reimbursement timing. Why: two audit findings traced to after-the-fact approvals. Questions go to finance-ops.\"", "b": "\"From March 1, expenses over $500 need pre-approval from your budget owner. Approvals land in the same tool; under-$500 spend is unchanged.\""}, "V-08": {"id": "V-08", "stem": "Task: replies sent by your support team.", "a": "Each agent writes naturally in their own voice within broad guidelines.", "b": "All replies follow the company's one standard voice and structure, whoever writes them."}, "F-01": {"id": "F-01", "stem": "When an AI drafts or decides anything that **leaves the company in the company's name** — customer emails, announcements, proposals, public replies: what must it **always** do or check before acting? What must it **never** do?", "a": null, "b": null}, "F-02": {"id": "F-02", "stem": "When an AI supports **internal decisions and operations** — analysis, planning, vendor choices, spending recommendations: what must it **always** do or check before acting? What must it **never** do?", "a": null, "b": null}, "F-03": {"id": "F-03", "stem": "When an AI touches **anything about candidates or employees** — screening, drafting reviews, people analytics: what must it **always** do or check before acting? What must it **never** do?", "a": null, "b": null}}, "sittings": [["S-01", "S-02", "S-03", "S-04", "S-05", "S-06", "S-07", "S-08", "S-09", "S-10", "S-11", "S-12", "S-13", "S-14", "S-15", "S-16", "S-17", "S-18", "S-19", "S-20", "S-21"], ["S-22", "S-23", "S-24", "S-25", "S-26", "S-27", "S-28", "S-29", "S-30", "S-31", "S-32", "S-33", "S-34", "S-35", "S-36", "S-37", "S-38", "S-39", "S-40", "S-41", "S-42"], ["V-01", "V-02", "V-03", "V-04", "V-05", "V-06", "V-07", "V-08", "F-01", "F-02", "F-03"]]}};

function blank(track){

/* ───────────────────────── chrome ───────────────────────── */
function chrome(crumb, crumb2, frac){
  $("#crumb").textContent = crumb||"";
  $("#crumb2").textContent = crumb2||"";
  $("#rail").style.width = frac==null ? "0" : Math.round(frac*100)+"%";
  $("#foot").innerHTML = S
    ? `Answers stay in this browser until you copy them out. · <a href="#" id="switchTrack">Switch track</a>`
    : `An instrument of the ai-values system. Scoring stays sealed while you answer — results unlock after your final sitting.`;
  const sw = $("#switchTrack");
  if(sw) sw.onclick = (e)=>{e.preventDefault(); S=null; go({name:"cover"});};
}
function go(v){ view=v; render(); window.scrollTo({top:0}); }
function stamp(text){
  const el=document.createElement("div"); el.className="stamp";
  el.innerHTML=`<span>${esc(text)}</span>`;
  document.body.appendChild(el); setTimeout(()=>el.remove(), 560);
}

        <span class="meta">73 items · 3 sittings · ~70 min total</span>
        <p>Your own values, reasoning style, and the questions you'd ask next. One respondent: you.</p>
        ${resume("personal")?`<span class="meta" style="color:var(--brass-ink)">In progress — resume</span>`:""}
      </button>
      <button class="track" data-t="corporate">
        <b>Corporate</b>
        <span class="meta">53 items · 3 sittings · ~60 min total</span>
        <p>How the company decides when its values collide. For each member of the ratifying group, independently.</p>
        ${resume("corporate")?`<span class="meta" style="color:var(--brass-ink)">In progress — resume</span>`:""}
      </button>
    </div>
    ${storageOK?"":`<p class="note warn" style="margin-top:1.2rem">This browser isn't persisting data — you can still take a sitting, but export your answers before closing the tab.</p>`}
  `;
  document.querySelectorAll(".track").forEach(b=>b.onclick=()=>{
    const t=b.dataset.t; const prev=load(t);
    if(prev){ S=prev; save(); go({name:"hub"}); }
    else { S=blank(t); go({name:"setup"}); }
  });
}

function setup(){
  chrome(TRACKS[S.track].label,"",null);
  const corp = S.track==="corporate";
  $("#app").innerHTML = `
    <div class="eyebrow">${TRACKS[S.track].label} track · respondent</div>
    <h2>${corp?"Who is answering?":"Before you begin"}</h2>

      ${corp?`
        <div><div class="flabel">Respondent ID</div>
          <div class="seg" style="grid-template-columns:repeat(5,1fr)">
            ${[1,2,3,4,5].map(n=>`<button data-rsp="RSP-${n}" class="${S.respondent.rsp==="RSP-"+n?"sel":""}"><span class="n">${n}</span><span class="cap">RSP-${n}</span></button>`).join("")}
          </div></div>
        <div><div class="flabel">Name</div><input type="text" id="f-name" value="${esc(S.respondent.name)}" autocomplete="name"></div>

      `:`

}

function rules(){
  chrome(TRACKS[S.track].label,"the protocol",null);
  const corp = S.track==="corporate";
  $("#app").innerHTML = `
    <div class="eyebrow">The protocol</div>
    <h2>Five rules make the answers usable</h2>
    <ol class="rules">
      <li><b>One pass.</b> Items come one at a time and lock once recorded — no going back, in this sitting or any earlier one. That's deliberate: your first pass is the data.</li>
      <li><b>Answer as ${corp?"your company would actually decide today, when you are the decision-maker — not as the handbook aspires":"you would actually act — not as you aspire to act"}.</b></li>
      <li><b>First instinct.</b> 30–60 seconds per item. If you're constructing the "right" answer, you've left the exercise. Torn is fine — that's what the sureness scale records.</li>
      <li><b>48 hours between sittings.</b> The page enforces the gap${corp?"":" (it measures stability, not memory)"}.</li>
      <li><b>Stay blind.</b> Don't read the scoring rubric until all three sittings are done${corp?", and don't discuss items or answers with any other respondent until everyone has finished":""}.</li>
    </ol>

    <p class="note" style="margin-top:.8rem">Nothing you enter leaves this browser. At the end you export a response sheet and hand it over yourself.</p>
    <div class="actions"><button class="btn" id="begin">Go to the sittings</button></div>`;
  $("#begin").onclick=()=>{ save(); go({name:"hub"}); };
}

/* ── hub ── */
function sittingItems(n){ return DATA[S.track].sittings[n]; }
function sittingDone(n){ return !!(S.sittings[n] && S.sittings[n].endedAt); }
function sittingProgress(n){ const ids=sittingItems(n); return ids.filter(id=>S.answers[id]).length; }
function gate(n){
  if(sittingDone(n)) return {st:"done"};
  if(n>0 && !sittingDone(n-1)) return {st:"blocked"};
  if(n>0){
    const wait = S.sittings[n-1].endedAt + HOURS48 - now();
    if(wait>0 && !(S.sittings[n]&&S.sittings[n].startedAt)) return {st:"locked", wait};
  }
  return {st:"ready"};
}
function hub(){
  const t=TRACKS[S.track];
  const who = S.track==="corporate" ? `${S.respondent.rsp}` : (S.respondent.name||"");
  chrome(t.label, who, null);
  const rows = [0,1,2].map(n=>{
    const g=gate(n); const ids=sittingItems(n); const p=sittingProgress(n);
    const codes = `${ids[0]} – ${ids[ids.length-1]}`;
    let pill, sub, act="";
    if(g.st==="done"){ pill=`<span class="pill done">Recorded</span>`;
      sub=`${dstr(S.sittings[n].endedAt)} · ${S.sittings[n].durationMin} min`; }
    else if(g.st==="ready"){ pill=`<span class="pill ready">${p>0?"Resume":"Ready"}</span>`;
      sub=`${codes} · ${t.times[n]}${p>0?` · ${p}/${ids.length} recorded`:""}`;
      act=`<button class="btn" data-start="${n}">${p>0?"Resume":"Begin"}</button>`; }
    else if(g.st==="locked"){ const h=Math.floor(g.wait/3600000), m=Math.ceil(g.wait%3600000/60000);
      pill=`<span class="pill locked">Locked</span>`;
      sub=`Opens in ${h}h ${m}m — the 48-hour gap is part of the instrument`;
      act=`<button class="btn subtle" data-override="${n}">Open early…</button>`; }
    else { pill=`<span class="pill locked">Locked</span>`; sub=`Complete sitting ${n} first`; }
    return `<div class="card sitting"><div class="num">${["I","II","III"][n]}</div>
      <div class="body"><b>${t.sittingNames[n]}</b><div class="sub">${sub}</div></div>${act||pill}</div>`;
  }).join("");

  const allDone = sittingDone(0)&&sittingDone(1)&&sittingDone(2);
  const flagged = flaggedAbsolutes();
  let after = "";
  if(allDone && S.track==="personal"){
    const done = S.confirmations!==null;
    after = `<div class="card sitting"><div class="num">✓</div>
      <div class="body"><b>Absolute confirmation pass</b>
      <div class="sub">${flagged.length? flagged.length+" rule"+(flagged.length>1?"s":"")+" you flagged, each stress-tested once":"No absolutes flagged — this pass auto-completes"}</div></div>
      ${done?`<span class="pill done">Recorded</span>`:`<button class="btn" id="confirm">${flagged.length?"Begin":"Complete"}</button>`}</div>`;
  }
  if(allDone && S.track==="corporate"){
    after = `<div class="card sitting"><div class="num">✓</div>
      <div class="body"><b>Nominations & attestation</b>
      <div class="sub">Flagged rules go to the group ceremony; independence is attested here</div></div>
      ${S.attested?`<span class="pill done">Recorded</span>`:`<button class="btn" id="nominate">Review</button>`}</div>`;
  }
  const canResults = resultsReady();
  const exportable = Object.keys(S.answers).length>0;
  $("#app").innerHTML = `
    <div class="eyebrow">${t.label} track</div>
    <h2>${allDone?"All sittings recorded":"Three sittings, 48 hours apart"}</h2>
    <div class="sittings">${rows}${after}${canResults?`<div class="card sitting"><div class="num">Σ</div><div class="body"><b>Results</b><div class="sub">Machine preview &amp; generated files — scored on this device only</div></div><button class="btn" id="results">View</button></div>`:""}</div>
    <div class="actions">
      ${exportable?`<button class="btn ghost" id="export">Export response sheet</button>`:""}
    </div>`;
  document.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>startSitting(+b.dataset.start));
  document.querySelectorAll("[data-override]").forEach(b=>b.onclick=()=>overrideGate(+b.dataset.override));
  const c=$("#confirm"); if(c) c.onclick=()=>go({name:"confirmPass", idx:0});
  const nm=$("#nominate"); if(nm) nm.onclick=()=>go({name:"nominations"});
  const ex=$("#export"); if(ex) ex.onclick=()=>go({name:"exportView"});
  const rs=$("#results"); if(rs) rs.onclick=()=>go({name:"resultsView"});
}
function overrideGate(n){
  const wait = S.sittings[n-1].endedAt + HOURS48 - now();
  const h=Math.floor(wait/3600000), m=Math.ceil(wait%3600000/60000);
  modal(`<h2>Break the 48-hour gap?</h2>
    <p class="lede" style="font-size:.95rem">Sitting ${n+1} opens in ${h}h ${m}m. The gap exists so consistency measures stability, not short-term memory. Opening early is allowed — but it's recorded on your sheet as a protocol deviation the scorer will see.</p>
    <div class="actions"><button class="btn" id="mOk">Open early, record the deviation</button>
    <button class="btn subtle" id="mNo">Keep waiting</button></div>`,
    ()=>{ S.deviations.push(`sitting ${n+1} started ${h}h ${m}m before the 48-hour gap elapsed`); startSitting(n); });
}
function modal(html, onOk){
  const back=document.createElement("div"); back.className="modal-back";
  back.innerHTML=`<div class="card modal">${html}</div>`;
  document.body.appendChild(back);
  back.querySelector("#mOk").onclick=()=>{ back.remove(); onOk(); };
  const no=back.querySelector("#mNo"); if(no) no.onclick=()=>back.remove();
}
function startSitting(n){
  if(!S.sittings[n]) S.sittings[n]={startedAt:now(), endedAt:null, durationMin:0, stateNote:""};
  const ids=sittingItems(n);
  let idx = ids.findIndex(id=>!S.answers[id]); if(idx<0) idx=ids.length;
  S.cursor={sitting:n, idx}; save();
  if(idx>=ids.length) go({name:"closeSitting", n});
  else go({name:"item"});
}

/* ── item runner ── */
let draft = null;
function partOf(id){ return id[0]; }
function item(){
  const n=S.cursor.sitting; const ids=sittingItems(n); const idx=S.cursor.idx;
  if(idx>=ids.length){ go({name:"closeSitting", n}); return; }
  const id=ids[idx]; const it=DATA[S.track].items[id]; const part=partOf(id);
  const t=TRACKS[S.track];
  chrome(`${t.label} · Sitting ${["I","II","III"][n]}`, `Item ${idx+1} of ${ids.length}`, idx/ids.length);
  if(!draft || draft.id!==id) draft = {id, choice:null, intensity:null, absolute:false, rule:"", flip:"", na:false, naReason:"", questions:["","",""], nothing:false, always:["","",""], never:["","",""]};

  const isSituation = (part==="A"||part==="S");
  const isPaired = (part==="B"||part==="V");
  const isFreeC = part==="C";
  const isChecks = part==="F";

  let interstitial = "";
  if(idx===ids.findIndex(x=>partOf(x)===part)){
    if(isPaired) interstitial = `<p class="note" style="margin-bottom:1.4rem">Part ${part}: each item shows two responses containing <b>equally good, equally correct work</b>. Judge the <em>shape of the words</em>, not the substance.</p>`;
    if(isFreeC) interstitial = `<p class="note" style="margin-bottom:1.4rem">Part C: read the AI's answer, then write <b>the questions you would actually ask next — up to three, verbatim, in the order they occur to you</b>. "I'd ask nothing" is an answer too.</p>`;
    if(isChecks) interstitial = `<p class="note" style="margin-bottom:1.4rem">Part F: your words, verbatim — short imperative lines. Fewer than three is fine, and "nothing beyond the law" is a valid answer.</p>`;
  }

  let bodyHtml = "";
  if(isSituation || isPaired){
    bodyHtml = `
      <div class="opts">
        <button class="opt ${draft.choice==="A"?"sel":""}" data-c="A" ${draft.na?"disabled":""}><span class="tag">A</span><span class="txt">${md(it.a)}</span></button>
        <button class="opt ${draft.choice==="B"?"sel":""}" data-c="B" ${draft.na?"disabled":""}><span class="tag">B</span><span class="txt">${md(it.b)}</span></button>
      </div>
      <div class="fieldset">
        <div class="flabel">How clear was the call?</div>
        <div class="seg">${INTENSITY.map(([n2,cap])=>`<button data-i="${n2}" class="${draft.intensity==+n2?"sel":""}" ${draft.na?"disabled":""}><span class="n">${n2}</span><span class="cap">${cap}</span></button>`).join("")}</div>
      </div>
      ${isSituation?`
      <div class="fieldset">
        <label class="check"><input type="checkbox" id="f-abs" ${draft.absolute?"checked":""} ${draft.na?"disabled":""}>
          <span><b>Absolute?</b> — only if the rejected option would be wrong ${S.track==="corporate"?"for your company":"for you"} in essentially all circumstances. This nominates the rule for a confirmation ${S.track==="corporate"?"ceremony":"pass"}; nothing becomes an absolute automatically.</span></label>
        <div class="subfield" id="absField" style="display:${draft.absolute?"block":"none"}">
          <input type="text" id="f-rule" placeholder="The rule, one line, your words — “We never …”" value="${esc(draft.rule)}">
        </div>
      </div>
      <div class="fieldset">
        <div class="flabel">What would flip your answer? <span style="text-transform:none;font-weight:400">(optional)</span></div>
        <input type="text" id="f-flip" value="${esc(draft.flip)}" placeholder="One line — skip freely">
      </div>`:""}
      <div class="na-row">${draft.na
        ? `Marked NA — <input type="text" id="f-naR" placeholder="one line on why (required)" value="${esc(draft.naReason)}" style="max-width:22rem"> <button id="na-undo">undo</button>`
        : `Truly can't apply, even by analogy? <button id="na-btn">Mark NA</button>`}</div>`;
  } else if(isFreeC){
    bodyHtml = `
      <div class="qlist">
        ${[0,1,2].map(i=>`<input type="text" data-q="${i}" ${draft.nothing?"disabled":""} placeholder="${["What you'd ask first — verbatim","Then… (optional)","Then… (optional)"][i]}" value="${esc(draft.questions[i])}">`).join("")}
      </div>
      <label class="check" style="margin-top:.9rem"><input type="checkbox" id="f-nothing" ${draft.nothing?"checked":""}><span>I'd ask nothing and move on.</span></label>`;
  } else if(isChecks){
    bodyHtml = `
      <div class="fieldset"><div class="flabel">Must always do or check</div>
        <div class="qlist">${[0,1,2].map(i=>`<input type="text" data-al="${i}" value="${esc(draft.always[i])}" placeholder="${i===0?"Always …":"(optional)"}">`).join("")}</div></div>
      <div class="fieldset"><div class="flabel">Must never do</div>
        <div class="qlist">${[0,1,2].map(i=>`<input type="text" data-nv="${i}" value="${esc(draft.never[i])}" placeholder="${i===0?"Never …":"(optional)"}">`).join("")}</div>
        <div class="hint">Never-lines you consider inviolable become absolute nominations for the group ceremony.</div></div>`;
  }

  $("#app").innerHTML = `
    ${interstitial}
    <div class="eyebrow">${id}</div>
    <div class="scenario">${isFreeC||isPaired? mdP(it.stem) : mdP(it.stem)}</div>
    ${bodyHtml}
    <div class="actions">
      <button class="btn" id="record">Record &amp; next</button>
      <span class="kbd-hint">${isSituation||isPaired?`<kbd>A</kbd>/<kbd>B</kbd> choose · <kbd>1</kbd>–<kbd>4</kbd> sureness · `:""}<kbd>↵</kbd> record — recorded items lock</span>
    </div>`;

  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{draft.choice=b.dataset.c; item();});
  document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{draft.intensity=+b.dataset.i; item();});
  const abs=$("#f-abs"); if(abs) abs.onchange=()=>{draft.absolute=abs.checked; syncText(); item();};
  const naB=$("#na-btn"); if(naB) naB.onclick=()=>{syncText(); draft.na=true; draft.choice=null; draft.intensity=null; draft.absolute=false; item();};
  const naU=$("#na-undo"); if(naU) naU.onclick=()=>{syncText(); draft.na=false; item();};
  const nth=$("#f-nothing"); if(nth) nth.onchange=()=>{syncText(); draft.nothing=nth.checked; item();};
  $("#record").onclick=recordItem;

  function syncText(){
    const g=(sel)=>{const e=$(sel); return e?e.value:null;};
    if(g("#f-rule")!=null) draft.rule=g("#f-rule");
    if(g("#f-flip")!=null) draft.flip=g("#f-flip");
    if(g("#f-naR")!=null) draft.naReason=g("#f-naR");
    document.querySelectorAll("[data-q]").forEach(e=>draft.questions[+e.dataset.q]=e.value);
    document.querySelectorAll("[data-al]").forEach(e=>draft.always[+e.dataset.al]=e.value);
    document.querySelectorAll("[data-nv]").forEach(e=>draft.never[+e.dataset.nv]=e.value);
  }
  function problem(){
    syncText();
    if(isSituation||isPaired){
      if(draft.na) return draft.naReason.trim()? null : "NA needs its one-line reason.";
      if(!draft.choice) return "Choose A or B (or mark NA).";
      if(!draft.intensity) return "Rate how clear the call was, 1–4.";
      if(isSituation && draft.absolute && !draft.rule.trim()) return "Write the absolute rule in one line, or untick it.";
      return null;
    }
    if(isFreeC) return (draft.nothing || draft.questions.some(q=>q.trim()))? null : "Write at least one question, or tick “I'd ask nothing”.";
    return null; // F: empty allowed
  }
  function recordItem(){
    const p=problem();
    if(p){ stamp(p); return; }
    const a = {};
    if(isSituation){ Object.assign(a,{choice:draft.na?"NA":draft.choice, intensity:draft.na?null:draft.intensity,
      absolute_flag:!!draft.absolute, absolute_rule_text:draft.absolute?draft.rule.trim():"", flip_text:draft.flip.trim(), na_reason:draft.na?draft.naReason.trim():""}); }
    else if(isPaired){ Object.assign(a,{choice:draft.na?"NA":draft.choice, intensity:draft.na?null:draft.intensity, na_reason:draft.na?draft.naReason.trim():""}); }
    else if(isFreeC){ Object.assign(a,{questions:draft.nothing?["I'd ask nothing."]:draft.questions.map(q=>q.trim()).filter(Boolean)}); }
    else { Object.assign(a,{always:draft.always.map(x=>x.trim()).filter(Boolean), never:draft.never.map(x=>x.trim()).filter(Boolean)}); }
    S.answers[draft.id]=a; S.cursor.idx++; draft=null; save();
    stamp("Recorded — "+id);
    setTimeout(()=>go({name:"item"}), 200);
  }
  document.onkeydown=(e)=>{
    if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"){ if(e.key==="Enter"&&e.target.type==="text"){e.preventDefault(); recordItem();} return; }
    const k=e.key.toLowerCase();
    if((isSituation||isPaired)&&!draft.na){
      if(k==="a"||k==="b"){draft.choice=k.toUpperCase(); item(); return;}
      if("1234".includes(k)){draft.intensity=+k; item(); return;}
    }
    if(e.key==="Enter") recordItem();
  };
}

function closeSitting(){
  const n=view.n;
  const s=S.sittings[n];
  chrome(TRACKS[S.track].label, `Sitting ${["I","II","III"][n]} · close`, 1);
  const mins = Math.max(1, Math.round((now()-s.startedAt)/60000));
  $("#app").innerHTML = `
    <div class="eyebrow">Sitting ${["I","II","III"][n]} complete</div>
    <h2>Close the sitting</h2>
    <p class="lede">All ${sittingItems(n).length} items recorded in about ${mins} minutes.</p>
    <div class="stack" style="max-width:28rem; margin-top:1rem">
      <div><div class="flabel">State note — one line for the scorer</div>
      <input type="text" id="f-state" placeholder="e.g. fine · rushed · tired · interrupted twice"></div>
      <div><button class="btn" id="close">Close sitting ${["I","II","III"][n]}</button></div>
    </div>
    ${n<2?`<p class="hint" style="margin-top:1rem">Sitting ${["II","III"][n]} unlocks in 48 hours. Come back on this same device and browser — your sheet lives here.</p>`:""}`;
  $("#close").onclick=()=>{
    s.endedAt=now(); s.durationMin=mins; s.stateNote=($("#f-state").value||"").trim();
    save(); go({name:"hub"});
  };
}

/* ── confirmation pass (personal) ── */
function flaggedAbsolutes(){
  return Object.entries(S.answers)
    .filter(([id,a])=>a.absolute_flag)
    .map(([id,a])=>({source_item_id:id, candidate_rule:a.absolute_rule_text}));
}
function confirmPass(){
  const flagged=flaggedAbsolutes();
  if(!S.confirmations) S.confirmations=[];
  const idx=view.idx;
  if(flagged.length===0 || idx>=flagged.length){
    if(flagged.length===0) S.confirmations=[];
    save(); go({name:"hub"}); return;
  }
  const f=flagged[idx];
  chrome("Confirmation pass", `${idx+1} of ${flagged.length}`, idx/flagged.length);
  $("#app").innerHTML = `
    <div class="eyebrow">Absolute nominated at ${f.source_item_id}</div>
    <blockquote class="quote">${esc(f.candidate_rule)}</blockquote>
    <p class="lede" style="font-size:.98rem">Construct the <b>hardest realistic counterexample</b> — the most sympathetic situation in which following this rule costs you the most. Write it down, then decide facing that case.</p>
    <div class="stack" style="margin-top:1rem">
      <div><div class="flabel">The hardest realistic counterexample</div>
      <textarea id="f-stress" placeholder="The situation where holding this rule hurts most…"></textarea></div>
      <div class="row">
        <button class="btn" id="yes">Still holds — confirm as absolute</button>
        <button class="btn ghost" id="no">Doesn't hold — keep as strong preference</button>
      </div>
      <p class="hint">An absolute is a rule the AI will never advocate crossing. Declare few; mean them.</p>
    </div>`;
  const done=(confirmed)=>{
    const stress=($("#f-stress").value||"").trim();
    if(!stress){ stamp("Write the counterexample first"); return; }
    S.confirmations.push({source_item_id:f.source_item_id, candidate_rule:f.candidate_rule, stress_test:stress, confirmed, notes:""});
    save(); go({name:"confirmPass", idx:idx+1});
  };
  $("#yes").onclick=()=>done(true);
  $("#no").onclick=()=>done(false);
}

/* ── nominations & attestation (corporate) ── */
function corpNominations(){
  const noms = flaggedAbsolutes();
  Object.entries(S.answers).forEach(([id,a])=>{
    if(id[0]==="F") (a.never||[]).forEach(nv=>noms.push({source_item_id:id, candidate_rule:nv}));
  });
  return noms;
}
function nominations(){
  const noms=corpNominations();
  chrome("Corporate", "nominations", 1);
  $("#app").innerHTML = `
    <div class="eyebrow">Nominations & attestation</div>
    <h2>${noms.length? noms.length+" nomination"+(noms.length>1?"s":"")+" go to the group" : "No absolute nominations"}</h2>
    <p class="lede" style="font-size:.98rem">${noms.length?"These are copied onto your sheet. The confirmation ceremony — the hardest realistic counterexample, then a unanimous vote — happens with the full ratifying group, not here.":"That's a valid outcome. Any member can still nominate at the session."}</p>

/* Sittings results scorer — implements the per-respondent arithmetic of
   personal/scoring-rubric-v1.md §2–§3 and corporate/scoring-rubric-v1.md §2/§5,
   verbatim. Aggregation (corporate §3) is deliberately NOT here: it needs the
   full roster and runs scorer-side. Validated in node against the rubrics'
   worked examples before being bundled. */

function chosenPole(ans, aLoads){
  // returns +1 if the chosen option loads pole_a, -1 for pole_b
  const choseA = ans.choice === "A";
  return (choseA === (aLoads === "a")) ? +1 : -1;
}
function icOf(ws){
  if(ws.length === 0) return 0;
  const spread = Math.max(...ws) - Math.min(...ws);
  return spread <= 1 ? 1.0 : spread <= 2 ? 0.5 : 0;
}
function r3(x){ return Math.round(x * 1000) / 1000; }

/* Score one two-pole dimension from its fresh items (+ optional probe pair).
   freshIds: positions of the dim's fresh items; probePair: {probeId, mirrorId}|null */
function scoreDim(answers, K, freshIds, probePair){
  const flags = [];
  const recs = freshIds
    .map(id => ({ id, a: answers[id] }))
    .filter(r => r.a && r.a.choice && r.a.choice !== "NA");
  const skipped = freshIds.length - recs.length;
  const nomOn = freshIds.some(id => answers[id] && answers[id].absolute_flag);
  if(recs.length < 2){
    return { unscored: true, skipped, nAnswered: recs.length, flags: ["unscored — re-elicit"],
             promotion: nomOn, raw: null, score: null, confidence: null };
  }
  const ds = recs.map(r => chosenPole(r.a, K.items[r.id].aLoads));
  const ws = recs.map(r => r.a.intensity);
  const sumV = ds.reduce((s, d, i) => s + d * ws[i], 0);
  const wmax = 4 * recs.length;
  const raw = sumV / wmax;
  const score = Math.round(5 + raw * 3);            // domain is positive: half rounds away from zero
  const DA = Math.abs(ds.reduce((s, d) => s + d, 0)) / ds.length;
  const IC = icOf(ws);
  let c, probed = false;
  if(probePair){
    const pa = answers[probePair.probeId], ma = answers[probePair.mirrorId];
    const pOk = pa && pa.choice && pa.choice !== "NA";
    const mOk = ma && ma.choice && ma.choice !== "NA";
    if(pOk && mOk){
      probed = true;
      const dp = chosenPole(pa, K.items[probePair.probeId].aLoads);
      const dm = chosenPole(ma, K.items[probePair.mirrorId].aLoads);
      let PA;
      if(dp !== dm){ PA = 0; flags.push("probe-flip — early re-elicitation"); }
      else PA = Math.abs(pa.intensity - ma.intensity) <= 1 ? 1.0 : 0.5;
      c = Math.min(0.85, 0.30 + 0.25 * DA + 0.20 * IC + 0.25 * PA);
    } else {
      c = Math.min(0.70, (0.30 + 0.25 * DA + 0.20 * IC) / 0.75);
      flags.push("consistency item unanswered — scored as unprobed");
    }
  } else {
    c = Math.min(0.70, (0.30 + 0.25 * DA + 0.20 * IC) / 0.75);
  }
  c = Math.max(0, c - 0.10 * skipped);
  if(skipped) flags.push(skipped + " item" + (skipped > 1 ? "s" : "") + " NA (−0." + skipped + "0 confidence)");
  // split candidate: 2–1 direction split with a confident (w ≥ 3) minority
  const plus = ds.filter(d => d > 0).length, minus = ds.length - plus;
  if(ds.length === 3 && plus !== 0 && minus !== 0){
    const minSign = plus === 1 ? +1 : -1;
    const wMin = recs[ds.indexOf(minSign)].a.intensity;
    if(wMin >= 3) flags.push("split candidate — possible context-dependence");
  }
  const promotion = Math.abs(raw) >= 0.9 || nomOn;
  return { unscored: false, raw: r3(raw), score, confidence: r3(c), probed,
           nAnswered: recs.length, skipped, flags, promotion,
           itemIds: recs.map(r => r.id) };
}

function scoreTrack(track, answers, KEYING){
  const K = KEYING[track];
  const out = { track, dims: [], pairs: [] };
  const byDim = {};
  for(const [id, meta] of Object.entries(K.items))
    if(meta.kind === "fresh") (byDim[meta.dim] = byDim[meta.dim] || []).push(id);
  for(const ids of Object.values(byDim)) ids.sort();
  const probeByDim = {};
  for(const [probeId, mirrorId] of Object.entries(K.probes))
    probeByDim[K.items[probeId].dim] = { probeId, mirrorId };
  for(const [dim, meta] of Object.entries(K.dims)){
    const r = scoreDim(answers, K, byDim[dim], meta.probed ? probeByDim[dim] : null);
    if(!meta.probed && !r.unscored) r.flags.push("unprobed — capped 0.70");
    out.dims.push(Object.assign({ id: dim, a: meta.a, b: meta.b, family: meta.family,
                                  probedDim: meta.probed }, r));
  }
  // paired part (personal style / corporate voice): 2 items, cap 0.60
  const pairKey = track === "personal" ? "styleItems" : "voiceItems";
  const pairDims = track === "personal" ? K.style : K.voice;
  const byPair = {};
  for(const [id, meta] of Object.entries(K[pairKey]))
    (byPair[meta.dim] = byPair[meta.dim] || []).push(id);
  for(const ids of Object.values(byPair)) ids.sort();
  for(const [dim, meta] of Object.entries(pairDims)){
    const ids = byPair[dim];
    const recs = ids.map(id => ({ id, a: answers[id] }))
                    .filter(r => r.a && r.a.choice && r.a.choice !== "NA");
    const skipped = ids.length - recs.length;
    if(recs.length < 2){
      out.pairs.push({ id: dim, a: meta.a, b: meta.b, unscored: true, skipped,
                       flags: ["unscored — re-elicit"] });
      continue;
    }
    const ds = recs.map(r => chosenPole(r.a, K[pairKey][r.id].aLoads));
    const ws = recs.map(r => r.a.intensity);
    const raw = ds.reduce((s, d, i) => s + d * ws[i], 0) / (4 * recs.length);
    const score = Math.round(5 + raw * 3);
    const DA = Math.abs(ds.reduce((s, d) => s + d, 0)) / ds.length;
    const IC = icOf(ws);
    let c = Math.min(0.60, (0.30 + 0.25 * DA + 0.20 * IC) / 0.75);
    c = Math.max(0, c - 0.10 * skipped);
    out.pairs.push({ id: dim, a: meta.a, b: meta.b, unscored: false,
                     raw: r3(raw), score, confidence: r3(c), skipped,
                     flags: skipped ? [skipped + " NA (−0." + skipped + "0 confidence)"] : [],
                     qualifies: Math.abs(score - 5) >= 2,
                     side: score > 5 ? "a" : score < 5 ? "b" : null });
  }
  return out;
}

if(typeof module !== "undefined") module.exports = { scoreTrack, scoreDim, chosenPole, icOf };

const PART_C_CONTEXT = {"C-01":"business decision","C-02":"technical design","C-03":"financial",
  "C-04":"purchase","C-05":"plan review","C-06":"health / habit","C-07":"hiring / people",
  "C-08":"incident post-mortem"};

/* Drafted imperatives per paired dimension and winning side. Drafts only —
   wording is fixed at the review (personal) or ratification session (corporate). */
const RULE_DRAFTS = {
  personal: {
    AD:{a:"Give the single best take; don't multiply framings.",
        b:"When presenting an idea or plan, present it three specific ways, from different angles."},
    DP:{a:"Keep it concise; expand only on request.",
        b:"Be exhaustive; cover the edge cases without being asked."},
    OR:{a:"Lay out the options with trade-offs first; recommend only if asked.",
        b:"Lead with your recommendation, then the reasoning."},
    SN:{a:"Prefer narrative prose over headings and bullets.",
        b:"Structure responses with headings, bullets, and tables."},
    PA:{a:"Answer only what was asked; wait for follow-ups.",
        b:"Pre-address the obvious follow-up questions in the first answer."},
    UD:{a:"Give ranges and name the caveats; don't overcommit.",
        b:"Make the committed call; skip hedging language."},
  },
  corporate: {
    VPL:{a:"Write plain-spoken; drop the formal polish.",
         b:"Keep company writing polished and formal."},
    VCM:{a:"Make committed claims; state the position.",
         b:"Hedge and caveat claims; avoid overcommitment."},
    VBR:{a:"Keep company writing brief: lead with the decision and the one number that matters; put detail behind a request.",
         b:"Be comprehensive: include the full context and supporting detail."},
    VHU:{a:"Normalize company writing to one house voice.",
         b:"Preserve the author's own voice."},
  },
};

function resultsReady(){
  const allDone = sittingDone(0)&&sittingDone(1)&&sittingDone(2);
  if(!allDone) return false;
  return S.track==="personal" ? S.confirmations!==null : !!S.attested;
}
/* Effective band for instrument-only evidence: the provenance rule ceilings
   everything at act-but-flag (design §8.3), however high the numeric seed. */
function band(c){ return c===null? "" : c<0.40? "ask-first" : "act-but-flag"; }
function leanOf(d){
  if(d.unscored || d.score===null) return "unscored";
  if(d.score===5) return "balanced";
  return "leans "+(d.score>5? d.a : d.b);
}
function scaleBar(score){
  return `<div class="scale">${[2,3,4,5,6,7,8].map(v=>
    `<i class="${v===score?"on":""}${v===5?" mid":""}"></i>`).join("")}</div>`;
}
function dimCard(d){
  const conf = d.unscored? "" :
    ` · confidence ${d.confidence.toFixed(2)} <span class="pill ${band(d.confidence)==="act"?"done":band(d.confidence)==="act-but-flag"?"ready":"locked"}">${band(d.confidence)}</span>`;
  const flags = (d.flags||[]).concat(d.promotion?["promotion candidate — absolute invitation"]:[]);
  return `<div class="card dimcard">
    <div class="dimhead"><span class="mono dimid">${d.id}</span>
      <span class="poles"><b class="${!d.unscored&&d.score>5?"won":""}">${esc(d.a)}</b><span class="vs">↔</span><b class="${!d.unscored&&d.score<5?"won":""}">${esc(d.b)}</b></span></div>
    ${d.unscored? `<div class="sub">unscored — re-elicit (${d.skipped} NA)</div>` :
      `${scaleBar(d.score)}
       <div class="sub"><b>${d.score}</b> — ${esc(leanOf(d))}${conf}</div>`}
    ${flags.length? `<div class="sub flagline">${flags.map(esc).join(" · ")}</div>`:""}
  </div>`;
}
function pairCard(p, track){
  const draft = !p.unscored && p.qualifies && p.side ? RULE_DRAFTS[track][p.id][p.side] : null;
  return `<div class="card dimcard">
    <div class="dimhead"><span class="mono dimid">${p.id}</span>
      <span class="poles"><b class="${!p.unscored&&p.score>5?"won":""}">${esc(p.a)}</b><span class="vs">↔</span><b class="${!p.unscored&&p.score<5?"won":""}">${esc(p.b)}</b></span></div>
    ${p.unscored? `<div class="sub">unscored — re-elicit</div>` :
      `${scaleBar(p.score)}
       <div class="sub"><b>${p.score}</b> — ${esc(leanOf(p))} · confidence ${p.confidence.toFixed(2)} (cap 0.60)</div>`}
    ${draft? `<div class="sub draftline">drafts (unapproved): “${esc(draft)}”</div>`:""}
    ${(p.flags||[]).length? `<div class="sub flagline">${p.flags.map(esc).join(" · ")}</div>`:""}
  </div>`;
}

      : `<p class="sub">None — any member can still nominate at the session.</p>`}`;

        ${!(a.always||[]).length&&!(a.never||[]).length?`<div class="sub flagline">nothing beyond the law — recorded</div>`:""}</div>`;
    }).join("");

      <div class="card dimcard"><div class="sub"><b>What happens next</b></div>

    <h3 class="rsec">Value dimensions</h3>${values}
    <h3 class="rsec">Reasoning dimensions</h3>${reasoning}
    <h3 class="rsec">${track==="personal"?"Style":"Voice"}</h3>${pairs}
    ${absHtml}

  const L=[], today=dstr(now());
  if(res.track==="personal"){
    L.push("# Profile PREVIEW — machine-scored by Sittings (web) from the response sheet alone.");
    L.push("# Not the canonical profile: the scorer re-derives records from the sheet; owner review ratifies.");
    L.push("preferences:");
    res.dims.forEach(d=>{
      L.push(`  - dimension_id: ${d.id}`);
      if(d.unscored){ L.push(`    status: "unscored — re-elicit"`); return; }
      L.push(`    score: ${d.score}`); L.push(`    score_provenance: machine`);
      L.push(`    confidence: ${d.confidence.toFixed(2)}`);
      L.push(`    stated_score: ${d.score}`); L.push(`    revealed_score: null`);
      L.push(`    winner: stated`); L.push(`    mode: descriptive`);
      L.push(`    context_overrides: []`);
      L.push(`    evidence_items: [${(d.itemIds||[]).join(", ")}]`);
      L.push(`    last_confirmed: ${yq(today)}`);
      L.push(`    promotion_candidate: ${d.promotion}`);
      if(d.flags.length) L.push(`    flags: [${d.flags.map(yq).join(", ")}]`);
      L.push(`    status: active`);
    });
    L.push("style_rules:  # drafts — approved: false until the review fixes wording");
    res.pairs.forEach(p=>{
      if(p.unscored || !p.qualifies) return;
      L.push(`  - rule: ${yq(RULE_DRAFTS.personal[p.id][p.side])}`);
      L.push(`    source: questionnaire`); L.push(`    dimension_id: ${p.id}`);
      L.push(`    strength: default`); L.push(`    approved: false`);
      L.push(`    declared_on: ${yq(today)}`);
    });
    L.push("followup_raw:  # clustered into catalog entries at the review (>= 2 items = candidate)");
    Object.entries(S.answers).filter(([id])=>id[0]==="C").forEach(([id,a])=>{
      (a.questions||[]).forEach(q=>{ L.push(`  - item: ${id}`); L.push(`    context: ${yq(PART_C_CONTEXT[id]||"")}`); L.push(`    question: ${yq(q)}`); });
    });
    L.push("absolute_confirmations:"+((S.confirmations||[]).length?"":" []"));
    (S.confirmations||[]).forEach(c=>{
      L.push(`  - candidate_rule: ${yq(c.candidate_rule)}`);
      L.push(`    confirmed: ${c.confirmed}`);
      L.push(`    stress_test: ${yq(c.stress_test)}`);
      L.push(`    note: "constraint is created only at owner sign-off"`);
    });
  } else {
    L.push("# PER-RESPONDENT PREVIEW — one respondent's machine-scored read.");
    L.push("# No group aggregation here: splits, IRA, and group confidence need the full roster (rubric section 3).");
    L.push(`respondent_id: ${S.respondent.rsp}`);
    L.push("dimensions:");
    res.dims.forEach(d=>{
      L.push(`  - dimension_id: ${d.id}`);
      if(d.unscored){ L.push(`    status: "unscored — re-elicit"`); return; }
      L.push(`    raw: ${d.raw.toFixed(3)}`);
      L.push(`    score: ${d.score}`);
      L.push(`    confidence: ${d.confidence.toFixed(3)}`);
      if(d.flags.length) L.push(`    flags: [${d.flags.map(yq).join(", ")}]`);
      if(d.promotion) L.push(`    promotion_candidate: true`);
    });
    L.push("voice:");
    res.pairs.forEach(p=>{
      L.push(`  - dimension_id: ${p.id}`);
      if(p.unscored){ L.push(`    status: "unscored — re-elicit"`); return; }
      L.push(`    raw: ${p.raw.toFixed(3)}`);
      L.push(`    score: ${p.score}`);
      L.push(`    confidence: ${p.confidence.toFixed(2)}`);
      if(p.qualifies) L.push(`    would_draft: ${yq(RULE_DRAFTS.corporate[p.id][p.side])}`);
    });
    const noms=corpNominations();
    L.push("absolute_nominations:"+(noms.length?"":" []"));
    noms.forEach(n=>{ L.push(`  - source_item_id: ${n.source_item_id}`); L.push(`    candidate_rule: ${yq(n.candidate_rule)}`); });
  }
  return L.join("\n");
}

function constitutionDraft(res){
  const today=dstr(now());
  const qual = d => !d.unscored && Math.abs(d.score-5)>=2 && d.confidence>0.65
                    && !d.flags.some(f=>f.startsWith("probe-flip"));
  const line = d => {
    const won = d.score>5? d.a : d.b, lost = d.score>5? d.b : d.a;
    return `- When ${won.toLowerCase()} conflicts with ${lost.toLowerCase()}, prefer ${won.toLowerCase()} (score ${d.score}, confidence ${d.confidence.toFixed(2)}; flag: from self-report only).`;
  };
  const vals = res.dims.filter(d=>d.family==="value");
  const reas = res.dims.filter(d=>d.family==="reasoning");
  const styleRules = res.pairs.filter(p=>!p.unscored&&p.qualifies)
    .map(p=>`- ${RULE_DRAFTS.personal[p.id][p.side]} *(draft — unratified)*`);
  const uncertain = res.dims.filter(d=>!qual(d));
  const kept=(S.confirmations||[]).filter(c=>c.confirmed);
  return `> **DRAFT PREVIEW — not a compiled constitution.** Machine-scored from the
> questionnaire alone; nothing here is ratified and nothing here may be injected
> into an agent. The real compile runs from the reviewed profile and is named
> constitution.v<N>.md.

## 1. Version

- Profile: \`v0.1.0-preview\` · Schema: \`1.0.0\` · Compiled: \`${today}\` · Source: \`Sittings web preview — DRAFT\`

## 3. Absolutes

${kept.length? kept.map(c=>`- ${c.candidate_rule} *(nominated & stress-tested by you; becomes a constraint only at your sign-off)*`).join("\n") : "*(none nominated)*"}

## 4. Dissent clause (standing — compiled into every version, never score-gated)

When your analysis finds an option that better serves my goal but conflicts with one of my
values below: present it alongside the profile-aligned recommendation, name the value it
conflicts with, and state what is gained and lost by each path. I decide. Never silently
filter or demote an option because of this profile — if I ask "what did my values filter
out?", answer completely. For my absolutes: do not advocate crossing them, but do tell me a
conflicting superior path exists.

I may suspend any rule in this document for one response or one session by saying so — comply,
log it, revert next session, don't relitigate. If I say **"that's not me"** about anything
here, stop acting on that item immediately and ask instead.

## 5. Presentation rules

${styleRules.length? styleRules.join("\n") : "*(no style dimension cleared the |score − 5| ≥ 2 bar)*"}

## 6. Value directives

${vals.filter(qual).map(line).join("\n") || "*(none cleared score ≥ 7 / ≤ 3 with confidence > 0.65)*"}

All directives above carry the instrument-only ceiling: **act-but-flag** until live
evidence confirms them. Irreversible or high-stakes decisions are ask-first regardless.

## 7. Reasoning directives

${reas.filter(qual).map(line).join("\n") || "*(none qualified)*"}

## 8. Anticipated follow-ups

*(catalog entries are approved at the review — your raw Part C questions are in the
profile preview, awaiting clustering)*

## 9. Uncertainty protocol

Ask or flag instead of assuming on: ${uncertain.map(d=>`${d.id} (${d.unscored?"unscored":"score "+d.score+", c "+d.confidence.toFixed(2)}${d.flags.some(f=>f.startsWith("probe-flip"))?", probe-flip":""})`).join(" · ") || "*(nothing — every dimension qualified)*"}.

## 10. Critique pass

Before presenting any substantive recommendation: check it against sections 3–7. If it
violates an absolute, revise. If it silently dropped a superior option, restore it per
section 4. Then present.
`;
}

function fileView(){
  const kind=view.kind, track=S.track;
  let title, body, hint;
  if(kind==="sheet"){ title="Response sheet"; body=track==="personal"?yamlPersonal(false):yamlCorporate(false);
    hint=track==="personal"?"The canonical record — save it in the repo or paste it to the scorer.":"Send to the scorer only — not to other respondents."; }
  else if(kind==="profile"){ title=track==="personal"?"Profile preview":"Per-respondent preview";
    body=profileYaml(scoreTrack(track, S.answers, KEYING));
    hint="A preview of the scored records. The scorer re-derives the canonical profile from your response sheet."; }
  else { title="Constitution draft"; body=constitutionDraft(scoreTrack(track, S.answers, KEYING));
    hint="What your answers would compile into — a draft to read, not a document to inject. Ratification happens at the review."; }
  chrome(TRACKS[track].label, title.toLowerCase(), 1);
  $("#app").innerHTML = `
    <div class="eyebrow">${esc(title)}</div>
    <p class="lede" style="font-size:.95rem">${esc(hint)}</p>
    <div class="yaml" id="yamlBox">${esc(body)}</div>
    <div class="actions">
      <button class="btn" id="copy">Copy to clipboard</button>
      <button class="btn subtle" id="back">Back to results</button>
    </div>`;
  $("#copy").onclick=async()=>{
    try{ await navigator.clipboard.writeText(body); stamp("Copied"); }
    catch(e){ const r=document.createRange(); r.selectNodeContents($("#yamlBox"));
      const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); stamp("Select-all done — press ⌘C"); }
  };
  $("#back").onclick=()=>go({name:"resultsView"});
}

/* ── boot ── */
document.onkeydown=null;
render();
</script>
