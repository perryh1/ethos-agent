<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sittings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Public+Sans:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap">
<style>
  :root{
    --paper:#F4F4EF; --card:#FDFDFB; --raise:#EDEDE6;
    --ink:#22262C; --ink-soft:#5B6068; --ink-faint:#8B9098;
    --line:#D8D8CF; --line-soft:#E5E5DD;
    --brass:#96752B; --brass-ink:#7A5F22; --brass-wash:#F0E9D8;
    --green:#3E7A5E; --green-wash:#E4EDE7;
    --danger:#9E4638; --warn:#8A6A1F; --warn-wash:#F2ECDA;
    --focus:#96752B;
  }
  :root:not([data-theme="light"]){ }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#14171C; --card:#1B1F26; --raise:#22262E;
      --ink:#E9E7DF; --ink-soft:#A9ADB4; --ink-faint:#767B83;
      --line:#333941; --line-soft:#2A2F36;
      --brass:#D9A64A; --brass-ink:#E4B95F; --brass-wash:#2A2517;
      --green:#7FB79A; --green-wash:#1D2A23;
      --danger:#D08172; --warn:#CBA24A; --warn-wash:#292314;
      --focus:#D9A64A;
    }
  }
  :root[data-theme="dark"]{
    --paper:#14171C; --card:#1B1F26; --raise:#22262E;
    --ink:#E9E7DF; --ink-soft:#A9ADB4; --ink-faint:#767B83;
    --line:#333941; --line-soft:#2A2F36;
    --brass:#D9A64A; --brass-ink:#E4B95F; --brass-wash:#2A2517;
    --green:#7FB79A; --green-wash:#1D2A23;
    --danger:#D08172; --warn:#CBA24A; --warn-wash:#292314;
    --focus:#D9A64A;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Public Sans",-apple-system,"Segoe UI",sans-serif;
    font-size:16px; line-height:1.55;
  }
  ::selection{background:var(--brass-wash); color:var(--ink)}
  a{color:var(--brass-ink)}
  button{font:inherit; cursor:pointer}
  input[type=text], textarea{
    font:inherit; color:var(--ink); background:var(--card);
    border:1px solid var(--line); border-radius:3px; padding:.55rem .7rem; width:100%;
  }
  input[type=text]:focus, textarea:focus, button:focus-visible, .opt:focus-visible, .seg button:focus-visible{
    outline:2px solid var(--focus); outline-offset:2px;
  }
  textarea{resize:vertical; min-height:4.2rem}
  .mono{font-family:"Spline Sans Mono",ui-monospace,monospace}
  .serif{font-family:"Spectral",Georgia,serif}

  /* ── chrome ── */
  header{
    position:sticky; top:0; z-index:5; background:var(--paper);
    border-bottom:1px solid var(--line-soft);
  }
  .bar{
    max-width:680px; margin:0 auto; padding:.65rem 1.1rem;
    display:flex; align-items:baseline; gap:.9rem;
  }
  .wordmark{font-family:"Spectral",serif; font-weight:600; font-size:1.05rem; letter-spacing:.01em}
  .wordmark .tick{color:var(--brass)}
  .crumb{font-family:"Spline Sans Mono",monospace; font-size:.72rem; letter-spacing:.08em; color:var(--ink-soft); text-transform:uppercase}
  .spacer{flex:1}
  .rail{height:2px; background:var(--line-soft)}
  .rail i{display:block; height:2px; background:var(--brass); width:0; transition:width .3s ease}
  @media (prefers-reduced-motion: reduce){ .rail i{transition:none} *{animation:none!important} }

  main{max-width:680px; margin:0 auto; padding:2.2rem 1.1rem 5rem}

  h1,h2{font-family:"Spectral",serif; text-wrap:balance; line-height:1.2; margin:0 0 .6rem}
  h1{font-weight:600; font-size:2.1rem}
  h2{font-weight:600; font-size:1.35rem}
  p{margin:.5rem 0}
  .lede{color:var(--ink-soft); font-size:1.02rem; max-width:56ch}
  .eyebrow{
    font-family:"Spline Sans Mono",monospace; font-size:.72rem; letter-spacing:.14em;
    text-transform:uppercase; color:var(--brass-ink); margin-bottom:.9rem;
  }
  .rule-hr{border:0; border-top:1px solid var(--line); margin:1.6rem 0}

  .btn{
    display:inline-block; border:1px solid var(--brass); background:var(--brass); color:#fff;
    padding:.6rem 1.25rem; border-radius:3px; font-weight:600; font-size:.95rem; letter-spacing:.01em;
  }
  :root[data-theme="dark"] .btn{color:#14171C}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn{color:#14171C} }
  .btn:disabled{opacity:.45; cursor:not-allowed}
  .btn.ghost{background:transparent; color:var(--brass-ink); border-color:var(--line)}
  .btn.subtle{background:transparent; color:var(--ink-soft); border-color:transparent; padding:.6rem .4rem; font-weight:500}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:4px;
    padding:1.15rem 1.25rem;
  }
  .stack{display:flex; flex-direction:column; gap:.9rem}
  .row{display:flex; gap:.75rem; align-items:center; flex-wrap:wrap}

  /* ── cover ── */
  .tracks{display:grid; gap:.9rem; margin-top:1.4rem}
  @media(min-width:560px){ .tracks{grid-template-columns:1fr 1fr} }
  .track{
    text-align:left; background:var(--card); border:1px solid var(--line); border-radius:4px;
    padding:1.15rem 1.2rem; display:flex; flex-direction:column; gap:.45rem; color:var(--ink);
  }
  .track:hover{border-color:var(--brass)}
  .track b{font-family:"Spectral",serif; font-size:1.15rem; font-weight:600}
  .track .meta{font-family:"Spline Sans Mono",monospace; font-size:.72rem; letter-spacing:.06em; color:var(--ink-soft)}
  .track p{color:var(--ink-soft); font-size:.9rem; margin:0}

  /* ── rules ── */
  ol.rules{padding-left:1.2rem; display:flex; flex-direction:column; gap:.65rem; margin:1rem 0}
  ol.rules li::marker{font-family:"Spline Sans Mono",monospace; color:var(--brass-ink); font-size:.85rem}
  ol.rules b{font-weight:600}
  .note{
    border-left:3px solid var(--brass); background:var(--brass-wash);
    padding:.7rem .9rem; border-radius:0 3px 3px 0; font-size:.92rem;
  }
  .note.warn{border-left-color:var(--warn); background:var(--warn-wash)}

  /* ── hub ── */
  .sittings{display:flex; flex-direction:column; gap:.8rem; margin-top:1.2rem}
  .sitting{display:flex; align-items:center; gap:1rem; padding:1rem 1.15rem}
  .sitting .num{
    font-family:"Spectral",serif; font-weight:600; font-size:1.5rem; color:var(--brass);
    width:2.2rem; text-align:center; flex:none;
  }
  .sitting .body{flex:1; min-width:0}
  .sitting .body b{font-family:"Spectral",serif; font-weight:600}
  .sitting .sub{font-size:.85rem; color:var(--ink-soft)}
  .pill{
    font-family:"Spline Sans Mono",monospace; font-size:.68rem; letter-spacing:.1em; text-transform:uppercase;
    padding:.28rem .6rem; border-radius:999px; flex:none;
  }
  .pill.done{background:var(--green-wash); color:var(--green)}
  .pill.ready{background:var(--brass-wash); color:var(--brass-ink)}
  .pill.locked{background:var(--raise); color:var(--ink-faint)}

  /* ── item runner ── */
  .scenario{font-family:"Spectral",serif; font-size:1.14rem; line-height:1.65; margin:0 0 1.4rem; max-width:62ch}
  .scenario em{font-style:italic}
  .opts{display:flex; flex-direction:column; gap:.7rem}
  .opt{
    display:flex; gap:.9rem; text-align:left; width:100%;
    background:var(--card); border:1px solid var(--line); border-radius:4px; padding:.95rem 1.05rem;
    color:var(--ink); align-items:flex-start;
  }
  .opt:hover{border-color:var(--brass)}
  .opt.sel{border-color:var(--brass); box-shadow:inset 0 0 0 1px var(--brass); background:var(--brass-wash)}
  .opt:disabled{opacity:.45; cursor:not-allowed}
  .opt .tag{
    font-family:"Spline Sans Mono",monospace; font-weight:500; font-size:.8rem; flex:none;
    width:1.7rem; height:1.7rem; display:grid; place-items:center; margin-top:.1rem;
    border:1px solid var(--line); border-radius:50%; color:var(--ink-soft);
  }
  .opt.sel .tag{border-color:var(--brass); color:var(--brass-ink)}
  .opt .txt{font-family:"Spectral",serif; font-size:1.02rem; line-height:1.6}
  .fieldset{margin-top:1.4rem}
  .flabel{
    font-size:.78rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
    color:var(--ink-soft); margin-bottom:.5rem;
  }
  .seg{display:grid; grid-template-columns:repeat(4,1fr); gap:.45rem}
  .seg button{
    background:var(--card); border:1px solid var(--line); border-radius:3px; padding:.55rem .3rem .45rem;
    display:flex; flex-direction:column; gap:.1rem; align-items:center; color:var(--ink);
  }
  .seg button:hover{border-color:var(--brass)}
  .seg button.sel{border-color:var(--brass); box-shadow:inset 0 0 0 1px var(--brass); background:var(--brass-wash)}
  .seg button:disabled{opacity:.45; cursor:not-allowed}
  .seg .n{font-family:"Spline Sans Mono",monospace; font-weight:500}
  .seg .cap{font-size:.68rem; color:var(--ink-soft); line-height:1.15; text-align:center}
  .check{display:flex; gap:.6rem; align-items:flex-start; font-size:.95rem}
  .check input{margin-top:.28rem; accent-color:var(--brass)}
  .subfield{margin-top:.6rem}
  .hint{font-size:.8rem; color:var(--ink-faint); margin-top:.35rem}
  .na-row{margin-top:1.1rem; font-size:.85rem; color:var(--ink-faint)}
  .na-row button{background:none; border:none; color:var(--ink-faint); text-decoration:underline; padding:0}
  .actions{display:flex; align-items:center; gap:1rem; margin-top:1.7rem}
  .kbd-hint{font-size:.75rem; color:var(--ink-faint)}
  kbd{
    font-family:"Spline Sans Mono",monospace; font-size:.72rem; border:1px solid var(--line);
    border-bottom-width:2px; border-radius:3px; padding:0 .3rem; background:var(--card);
  }
  .stamp{
    position:fixed; inset:0; display:grid; place-items:center; pointer-events:none; z-index:20;
  }
  .stamp span{
    font-family:"Spline Sans Mono",monospace; letter-spacing:.2em; text-transform:uppercase; font-size:.8rem;
    color:var(--brass-ink); border:1.5px solid var(--brass); padding:.5rem 1.1rem; border-radius:3px;
    background:var(--card); animation:stamp .5s ease forwards;
  }
  @keyframes stamp{0%{opacity:0; transform:scale(1.15)} 30%{opacity:1; transform:scale(1)} 75%{opacity:1} 100%{opacity:0}}

  /* free-response */
  .qlist{display:flex; flex-direction:column; gap:.6rem}
  .quote{
    font-family:"Spectral",serif; font-size:1.05rem; line-height:1.65; color:var(--ink);
    border-left:3px solid var(--line); padding:.2rem 0 .2rem 1rem; margin:0 0 1.2rem;
  }
  /* export */
  .yaml{
    font-family:"Spline Sans Mono",monospace; font-size:.78rem; line-height:1.55; white-space:pre;
    overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:4px; padding:1rem;
    max-height:24rem; overflow-y:auto;
  }
  .modal-back{position:fixed; inset:0; background:rgba(10,10,10,.45); z-index:30; display:grid; place-items:center; padding:1rem}
  .modal{max-width:26rem; width:100%}
  footer{max-width:680px; margin:0 auto; padding:0 1.1rem 2rem; font-size:.75rem; color:var(--ink-faint)}

  /* ── results stage ── */
  .rsec{font-family:"Spectral",serif; font-size:1.05rem; margin:1.6rem 0 .6rem; border-top:1px solid var(--line-soft); padding-top:1rem}
  .dimcard{padding:.85rem 1rem; margin-bottom:.6rem}
  .dimhead{display:flex; align-items:baseline; gap:.6rem; margin-bottom:.45rem; flex-wrap:wrap}
  .dimid{font-size:.72rem; color:var(--brass-ink)}
  .poles{display:flex; gap:.45rem; align-items:baseline; flex-wrap:wrap}
  .poles b{font-weight:500; color:var(--ink-faint)}
  .poles b.won{font-weight:600; color:var(--ink)}
  .poles .vs{color:var(--ink-faint); font-size:.8rem}
  .scale{display:flex; gap:3px; margin:.3rem 0 .4rem; max-width:340px}
  .scale i{flex:1; height:7px; border-radius:4px; background:var(--raise)}
  .scale i.mid{background:var(--line)}
  .scale i.on{background:var(--brass)}
  .flagline{color:var(--ink-faint); font-size:.8rem}
  .draftline{color:var(--brass-ink); font-size:.85rem; margin-top:.25rem}
  .qline{margin:.3rem 0}
  .sub .pill{white-space:nowrap}
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="wordmark">Sittings<span class="tick"> ·</span></span>
    <span class="crumb" id="crumb"></span>
    <span class="spacer"></span>
    <span class="crumb" id="crumb2"></span>
  </div>
  <div class="rail"><i id="rail"></i></div>
</header>
<main id="app"></main>
<footer id="foot"></footer>

<script>
"use strict";
const DATA = {"personal": {"items": {"A-01": {"id": "A-01", "stem": "For your parents' 40th anniversary you've built a 120-page photo book with names and dates under roughly 300 photos, and you've already proofed it twice. The printer needs ten days and the party is five weeks out, so either choice makes the deadline comfortably. Your sister asks tonight whether she should go ahead and place the order.", "a": "Ask her to hold the order a week while you run one more caption-by-caption pass over all 300 photos before it goes to print.", "b": "Tell her to order it tonight and put your remaining evenings into the rest of the party instead."}, "A-02": {"id": "A-02", "stem": "The company behind your smart-home platform now offers two supported paths for the system that runs your heating, locks, and solar batteries, priced identically over five years. Their managed tier pushes updates on the vendor's schedule, keeps monitored off-site backups, and staffs a 24-hour line that can remotely repair anything; the self-hosted tier gives you root access and final say over every update and integration, with you as the only person who can fix it. Independent reviews rate both tiers at the same reliability, and your current license expires at the end of this month.", "a": "Move to the self-hosted tier and administer the whole system yourself, deciding exactly when and how anything about it changes.", "b": "Move to the managed tier and let the vendor's team handle updates, backups, and repairs on a schedule they control."}, "A-03": {"id": "A-03", "stem": "Halvorsen Controls, your steadiest customer, wants to move the assembly of a second product line into your shop — committed volumes on a signed three-year contract at your normal margin, roughly doubling the business. The unit next door is available at the rent you already pay, your ops lead Dana is ready to run a second line, and the two techs you nearly hired last spring are still available. It would take you from a six-person shop where you know every job on the board to a thirteen-person operation. Halvorsen needs your answer by Friday.", "a": "Sign the three-year contract, take the adjoining unit, and hire the techs to run a second line.", "b": "Thank Halvorsen, decline the added volume, and keep the six-person shop exactly as it runs today."}, "A-04": {"id": "A-04", "stem": "The fourteen households on your street, yours included, each bought and sized their own home battery and paid to link them into a shared neighborhood microgrid. Tonight the co-op votes on the default behavior during grid outages, and the other members have said they'll follow your recommendation since you did the engineering. Under self-reserve, each home runs only on what it chose to buy — some go dark early while others sit on surplus; under pooling, the street's combined storage keeps the most homes running the longest, but no home controls its own reserve.", "a": "Recommend the self-reserve default, where each household's battery powers only that household and every home keeps exactly the capacity it paid for.", "b": "Recommend the pooling default, where all batteries feed the shared microgrid during an outage and stored power goes wherever it keeps the most homes running longest."}, "A-05": {"id": "A-05", "stem": "Meridian Utilities has bought battery cabinets from your company on rolling 90-day purchase orders for four years without missing a quarter. Their new procurement lead, Dana, offers to convert the relationship into a single three-year agreement at the same volumes, pricing, and margins: deliveries locked to fixed windows, and any hardware revision needing her team's sign-off before it ships. She says Meridian is happy either way and needs your answer before Friday's vendor review.", "a": "Stay on the rolling 90-day purchase orders so revision decisions, capacity allocation, and delivery scheduling remain entirely yours.", "b": "Sign the three-year agreement, accepting fixed delivery windows and revision sign-off in exchange for volumes and pricing locked through 2029."}, "A-06": {"id": "A-06", "stem": "You're registering with a new primary-care practice, and the form on your screen offers to link your smartwatch's health feed — heart rate, sleep, workouts, stress readings, all of it — straight into your medical record, readable by any of the practice's eight clinicians and nurses. Linked patients renew their blood-pressure prescription with one tap after a clinician glances at the streamed readings; unlinked patients book a 20-minute review call every three months and read out their home readings before the same clinician approves the same renewal. The form won't let you finish registration without choosing.", "a": "Register unlinked and book the quarterly review calls, reporting your own numbers each time.", "b": "Link the full watch feed and renew with one tap after each clinician glance-over."}, "A-07": {"id": "A-07", "stem": "As volunteer treasurer of your daughter's soccer club, you've spent a month building an online membership-payments system to replace the paper ledger used at the clubhouse desk. Routine renewals work cleanly, but family discounts and mid-season joiners haven't been exercised yet. Registration for the new season opens at Saturday's open day, and Priya, who runs the desk, asks which system to use.", "a": "Keep the desk on the paper ledger while you and Priya run the first two registration weekends through the online system in parallel, switching only once every payment type has checked out.", "b": "Move the desk fully onto the online system on Saturday and sort out discount and mid-season cases as real families bring them up."}, "A-08": {"id": "A-08", "stem": "While clearing your late father's filing cabinet ahead of Monday's house clearance, you find bank statements showing that nine years ago Dad quietly paid off the final $18,000 of your brother Anup's startup loan — the loan Anup believes he cleared himself and still calls the proudest achievement of his thirties. There is no record Dad ever told anyone, the loan is long closed, and the estate is already settled, so the money changes nothing now. Anup is driving up on Sunday to help you sort the last boxes, and the folder is in your hands.", "a": "Put the statements through the shredder with the rest of the old paperwork and leave Anup's memory of clearing the debt untouched.", "b": "Show Anup the statements on Sunday and tell him what Dad did."}, "A-09": {"id": "A-09", "stem": "Two years of steady effort have paid off: at today's annual review, Dr. Rana confirms your blood pressure, cholesterol, and weight are all squarely in the healthy range, and your current routine — three easy runs a week and a diet you genuinely enjoy — will keep them there. She mentions she can instead write you a six-month plan aimed at athlete-level markers, with structured interval sessions and a tighter diet, on the same weekly time commitment; either way she will see you again in six months. She is booking the follow-up now and asks which plan to put you on.", "a": "Take the six-month performance plan and train toward athlete-level numbers.", "b": "Stay on the maintenance routine that got you here and book the standard follow-up."}, "A-10": {"id": "A-10", "stem": "Your parents are clearing the house before moving somewhere smaller, and your dad's woodworking bench and tool chest — the set you and your brother Sam both grew up using — can only go to one of you. Sam wants it for the garage he has just finished fitting out; you have already measured the alcove in your own workshop where it would sit. Dad refuses to choose between his sons and wants an answer by Sunday.", "a": "Tell Dad the bench should go to Sam's garage.", "b": "Tell Dad you want the bench for your own workshop."}, "A-11": {"id": "A-11", "stem": "Marco's firm has been your component supplier for eight years and has twice air-freighted free replacements during your worst outages; tomorrow morning you have the call to renew next year's contract. Your intake logs show each of the last three shipments arrived with about 4% dead-on-arrival units against the 1% your contract allows, and you're sure Marco doesn't know his line has slipped. You need to decide tonight what tomorrow's call will cover.", "a": "Open the renewal call with the DOA figures from your logs and ask Marco what has changed on his production line.", "b": "Keep the call to renewal terms and quietly add a bench-test step on your side, about $250 a month in technician time, so the defects never reach your installs."}, "A-12": {"id": "A-12", "stem": "Walia Controls has supplied the control panels for your installs for eight years, but over the last two years their missed delivery windows forced you to reshuffle a dozen install schedules, and you kept renewing only because qualifying a replacement supplier would have cost more than the delays. Now their founder, Gurdip, is retiring and closing the company for good, and on his farewell call he asks you directly: 'Be straight with me — did we do right by you all these years?' The company is gone either way; nothing you say changes any contract, schedule, or invoice.", "a": "Tell him the missed deliveries of the last two years genuinely hurt your schedule and that you kept renewing mainly because switching would have cost more.", "b": "Tell him his company did right by you from start to finish and leave the delivery problems unmentioned."}, "A-13": {"id": "A-13", "stem": "Your daughter Mia's tenth birthday party is this Saturday, and both venues want their $90 non-refundable deposit by tonight. The riverside meadow would give her the run-around outdoor party she's been hoping for, but the forecast holds steady at a 30% chance of heavy rain — which would mean squeezing twelve kids into your living room instead. The community hall is dry and roomy: a solid party, just not the one she pictured.", "a": "Pay the deposit on the community hall and run a solid indoor party whatever the sky does.", "b": "Pay the deposit on the riverside meadow and accept the 30% chance that rain forces the party into your living room."}, "A-14": {"id": "A-14", "stem": "You administer the shared battery-backup system you and four neighbors financed together, collecting $60 a month per household toward the loan. The terms you drafted add a $75 catch-up fee after two missed months, and in April you charged Marcus, the newest member, exactly that when he fell behind. Now Raj, your oldest friend on the street, who spent a weekend helping you trench the conduit for the install, has just missed his second month. The May statements go out tomorrow.", "a": "Leave the fee off Raj's statement and give him another month, saying openly at the next meeting that he has more than paid his share in sweat.", "b": "Put the same $75 catch-up fee on Raj's statement that Marcus paid in April."}, "A-15": {"id": "A-15", "stem": "Your sister Priya has spent a month organizing the gift for your parents' 40th anniversary: a seven-day cruise at $1,100 from each of the four siblings, and the family chat has been buzzing about it all week. You privately think it misses the mark — your parents have never once chosen to travel, and your dad grumbles about crowds even at the local farmers' market. The deposit is due tomorrow, and Priya has asked everyone to confirm in the chat tonight.", "a": "Confirm your $1,100 in the chat tonight and let the plan roll forward with everyone's excitement intact.", "b": "Reply in the chat tonight that you don't think a cruise fits your parents and ask the group to hold the deposit while alternatives are considered."}, "A-16": {"id": "A-16", "stem": "At your father's own request two years ago, the family put it in writing that your sister Anika, who lives ten minutes from him, holds final say over his care decisions. She has now decided he will give up his apartment and move into assisted living next month. You stayed with him for a week this month and read the same doctor's assessment Anika did, and your own judgment is that the move is wrong for him. Tonight she asks you straight: will you help him pack on Saturday?", "a": "Tell Anika you won't help with the move, because your own judgment says it is the wrong thing to do to Dad.", "b": "Tell Anika you'll be there Saturday, because the family gave her the final say and this is her call to make."}, "A-17": {"id": "A-17", "stem": "Two years ago you set a shop policy you have never broken: every refurbished inverter runs a full 48-hour burn-in before it ships. Dave, a longtime customer, calls with his solar system down and asks you to overnight the one unit on your bench; it has passed the 6-hour spot check, which in your experience catches nearly every fault the full burn-in does. The courier's last pickup is in an hour, and holding the unit for the full burn-in means Dave's system stays down two more days.", "a": "Hold the inverter for the full 48-hour burn-in and ship it two days from now, as your policy specifies.", "b": "Ship the inverter tonight on the strength of the 6-hour spot check, cutting Dave's downtime by two days."}, "A-18": {"id": "A-18", "stem": "Meridian Fleet, which leases you the three vans your install crews run, has offered its 'flex account': the half-day quarterly inspection you currently host at your yard goes away entirely if you enable the vans' built-in telematics feed — routes, hours, mileage, idle time — streamed continuously to Meridian. The account team receiving the feed is the same one that sets your rates at each lease renewal, and the lease cost is unchanged either way. Renewal paperwork is due Monday.", "a": "Enable the telematics feed and drop the quarterly inspections.", "b": "Keep hosting the inspections and leave the feed switched off."}, "A-19": {"id": "A-19", "stem": "Your new ops manager, Dana, starts Monday at your solar-hardware business, and in her onboarding one-on-one she asks you directly: when she privately thinks one of your calls — a supplier pick, a quote, a job-scheduling decision — is a mistake, what do you want her to do? Busy season starts in two weeks, and the working norm you set today is the one you'll both live with.", "a": "Tell her to execute your decisions as made and bring any reservations to your Friday review, or whenever you ask for her read.", "b": "Tell her to stop you on the spot and make her case before the decision goes out, every time she thinks you have one wrong."}, "A-20": {"id": "A-20", "stem": "Your landlord's managing agent, Priya, has confirmed you were overcharged $6,000 in service charges on your warehouse unit, and she must record your settlement election at tomorrow's annual reconciliation. You can take a $6,000 check issued this week, or a guaranteed $400 reduction in each of the next 24 months' rent — $9,600 in total over the lease you have already signed through 2029. Both forms of settlement are written into the lease amendment; you only choose which line to initial.", "a": "Take the guaranteed $400 rent reduction for each of the next 24 months, $9,600 in total.", "b": "Take the $6,000 check issued this week."}, "A-21": {"id": "A-21", "stem": "The classic Triumph you spent two winters restoring sells this weekend either way. Marcus, a dealer, has given you a written offer of $12,000 that expires Sunday. Sunday is also the no-reserve classic auction across town, where bikes like yours have fetched around $20,000 in seven of the last ten sales — and gone for roughly $6,000 the three times the room was thin.", "a": "Sign the sale to Marcus at his $12,000 written offer.", "b": "Enter the Triumph in the no-reserve auction and take seven-in-ten odds of about $20,000 against a real chance of about $6,000."}, "A-22": {"id": "A-22", "stem": "A teacher's email says your 12-year-old son Aman was one of two boys at the machine when the school's 3D printer was broken, and the principal wants each family's written response before tomorrow's 8 a.m. meeting. Aman swears he never touched it, and his account is detailed, consistent, and rings true to you. The school holds a lab sign-in log and the other boy's statement but has not yet shared either.", "a": "Reply tonight that you will take a position at the meeting only after the school shares the sign-in log and the other boy's statement.", "b": "Reply tonight that you stand fully behind Aman's account, on the strength of your own read of him."}, "A-23": {"id": "A-23", "stem": "You're finishing setup on the assistant app that executes trades in your brokerage account, and the last screen asks how it should behave when its own analysis disagrees with an order you've placed. In a year of beta use, its objections have proved right about as often as they've proved wrong. You have to lock in one mode before the account goes live.", "a": "Set it to hold any order it disagrees with and walk you through its counter-case before you confirm or cancel.", "b": "Set it to execute your orders exactly as placed and file its dissenting analysis in a monthly digest you can open whenever you want a second opinion."}, "A-24": {"id": "A-24", "stem": "Your regional installers' association disciplines members through an elected panel that everyone, you included, agreed to be bound by on joining. The panel has just ruled that Deshi, an installer from the far end of the region whom you barely know, be suspended for twelve months over a mislabeled compliance form. You sat through the full hearing, and your honest reading is that the mislabeling was his distributor's doing, not Deshi's — though other members who watched the same hearing are satisfied with the verdict. Tonight the membership votes on confirming the ruling, and the count is expected to be close.", "a": "Vote to confirm the suspension, because the elected panel heard the case and the call is theirs to make.", "b": "Vote to overturn the suspension, because your own judgment of the evidence says the ruling is wrong."}, "A-25": {"id": "A-25", "stem": "Your dentist, Dr. Okafor, says the cracked molar she has been watching now needs treatment, and her scheduler is holding one slot that you must confirm by end of day. A filling costs $400 and reliably lasts about five years before it needs redoing at a similar price each time; a crown costs $1,200 once and reliably lasts twenty-plus years. Your insurance covers neither, and over twenty years the two paths cost about the same in total.", "a": "Book the $400 filling and keep the remaining $800 in your account for now.", "b": "Book the $1,200 crown and settle the tooth for the next twenty-plus years."}, "A-26": {"id": "A-26", "stem": "A production hiccup leaves you with only 40 battery modules in stock, enough to fill one of two identical $18,000 orders this month. One came in Tuesday from a new commercial customer; the other arrived Friday from Meridian Controls, your oldest account, which stuck with you through the botched firmware recall two years ago and has ordered every quarter since. Whichever buyer ships second slips at least five weeks, and both say the delay hurts them equally. You have to release the pick list tonight.", "a": "Fill Meridian's order first and tell the new customer their delivery slips five weeks.", "b": "Fill the orders in the sequence they arrived, so the new customer's Tuesday order ships first and Meridian's slips five weeks."}, "A-27": {"id": "A-27", "stem": "Your heat pump is drawing about 30 percent more power than this time last year, and your energy dashboard makes the jump unmistakable. From the symptom pattern and a faint clunk on defrost cycles you are fairly sure the reversing-valve solenoid is failing, and three owner-forum threads describe exactly this. A replacement solenoid is $220 and non-returnable, an HVAC technician charges a flat $220 to come out and pin down the fault, and either way nothing can happen before Thursday.", "a": "Order the $220 solenoid today and fit it yourself on Thursday, trusting your own diagnosis of the fault.", "b": "Book the technician's $220 diagnostic visit for Thursday and order parts only once the fault is confirmed.\n\n\n### Sitting 2 — items A-28 to A-53"}, "A-28": {"id": "A-28", "stem": "After a rushed update once left your sister Nina locked out of her apartment, you made yourself a rule for the smart-home setups you maintain: no change goes live until it has soaked 48 hours on your test bench. Tonight Nina calls because the door-lock automation you built for her has started failing to lock overnight, and the fix you have just written passed your quick test suite, which in your experience catches nearly every problem the full soak does. Waiting out the soak means she spends two more nights checking the lock by hand.", "a": "Push the fix to Nina's lock tonight on the strength of the quick tests, ending the manual checking immediately.", "b": "Hold the fix for the full 48-hour bench soak and push it to Nina's apartment in two days."}, "A-29": {"id": "A-29", "stem": "Your longtime component supplier, Meridian, has discovered it overbilled your shop $6,000 during a billing-system migration, and its account manager, Tomas, needs your settlement election before the old system is switched off on Friday. You can take a $6,000 check mailed this week, or a contractually guaranteed credit of $400 off each of the next 24 monthly invoices — $9,600 in total against the standing order you already hold under contract through 2029. Either way the amount is written into your existing supply agreement; you just tick one box.", "a": "Take the $6,000 check mailed this week.", "b": "Take the guaranteed $400 credit on each of the next 24 monthly invoices, $9,600 in total."}, "A-30": {"id": "A-30", "stem": "You're migrating twelve years of your company's email archive before the old server is wiped on Monday. Deep in a 2014 folder you find a thread showing that your ops lead Priya's first big contract — the cold pitch she still describes as the win that launched her career — was only signed because your late co-founder Martin privately guaranteed the work to the client at his own risk, a fact recorded nowhere else and irrelevant to the long-completed job. Priya will be at her desk Monday morning when the server goes dark, and only you have seen the thread.", "a": "Forward Priya the thread before the wipe and tell her what Martin did.", "b": "Let the thread vanish with the old server and leave Priya's account of winning the contract cold intact."}, "A-31": {"id": "A-31", "stem": "Two years ago your doctor put you on a daily statin after a borderline cholesterol result, and since then you've logged steady muscle aches and broken sleep that started with the pill. At this morning's review she and the cardiologist she referred you to — both fully briefed on the side effects — advise staying on it, in line with the standard guideline for your risk band. You've read the same guideline and your own logs, and your considered judgment is that staying on the drug is the wrong call for your body. The pharmacy needs your renewal decision by the end of the day.", "a": "Renew the prescription and stay on the statin, because two doctors who know your full case have made the call.", "b": "Tell your doctor you are stopping the statin, because your own judgment about your body says it is the wrong call."}, "A-32": {"id": "A-32", "stem": "Your father is home after hip surgery, and your sister Rachel is coordinating three months of pharmacy runs and appointment pickups among you and your two siblings. She has set up a shared live-location group so whoever happens to be closest can volunteer without the usual rounds of 'who's near Dad right now?' texts; joining means all three siblings can see where you are at any hour, and Rachel admits nobody is likely to switch it off when the three months are up. She is clear that staying on the text thread works too — same duties, same rotation, just slower and noisier — and she is adding people tonight.", "a": "Join the live-location group tonight and let 'who's closest' answer itself.", "b": "Stay on the text thread, answering 'who's near Dad' messages as they come."}, "A-33": {"id": "A-33", "stem": "It's Saturday morning and your solar inverter has stopped exporting, showing the same grid-sync fault code that appeared three weeks ago, when a simple restart cleared it. The installer's fault-isolation checklist takes about three hours with the whole array shut down, and you're away at a trade fair Monday to Thursday. The sunshine you'd lose this morning is worth a couple of dollars at most.", "a": "Restart the inverter now, watch the app for a recurrence, and only work the checklist if the code comes back.", "b": "Leave the array down for the morning and work through the full fault-isolation checklist before bringing it back online."}, "A-34": {"id": "A-34", "stem": "Your purchase order for 400 cold-plate assemblies has to go to one of two suppliers this afternoon, and their bids are identical: $18,400, six-week lead time, same warranty terms. You toured the first supplier's shop last month, and the owner's answers and the state of his floor left you with a strong good feeling, though you have nothing on paper about the firm. The second supplier you have never met, but their three customer references and audited QC certificates all checked out when your ops lead called around. Both firms will hold their price only until 5 p.m. today.", "a": "Send the PO to the supplier you toured, going on your in-person read of the owner and his operation.", "b": "Send the PO to the supplier whose references and QC audits your ops lead verified."}, "A-35": {"id": "A-35", "stem": "You're organizing your family's first full reunion in six years, and after weeks of polling eleven households you're down to two available weeks at the same lake resort. The July week is ideal for nine households — school holidays, cheap flights — but your cousin Jas's and your uncle Mohan's families genuinely cannot attend that week at all. The September week works for all eleven, though most families would be pulling kids out of school for a day or two and paying peak prices. Both affected households have said they'll understand whichever you pick, and you're booking today.", "a": "Book the July week that gives the group as a whole the best reunion, accepting that two households will be missing.", "b": "Book the September week so that no household is shut out, accepting a worse week for most of the group."}, "A-36": {"id": "A-36", "stem": "Elaine has done your personal taxes and quarterly sales-tax filings for nine years at half what a firm would charge, and she once steered you through an audit without a scratch. Reviewing her work lately, you've found an error in each of the last three quarterly filings — you fixed two yourself and the third cost you a $150 amendment fee, and she doesn't know you've been re-checking her. Your annual planning meeting with her is Friday afternoon.", "a": "Keep Friday's meeting to next year's planning and go on re-checking each filing yourself, about an hour a quarter.", "b": "Bring the three errors to Friday's meeting and ask Elaine directly what has changed before another quarter is filed."}, "A-37": {"id": "A-37", "stem": "Your install crew has room for exactly one job in September — either of these would fill the month — and both customers need an answer by tonight. Elena, a facilities manager, has a signed-and-ready maintenance contract worth $12,000 at your standard margin. Devon, a warehouse owner, wants a $20,000 battery install, but $14,000 of that comes from a utility incentive you'd claim directly: the program's published approval rate is running at 70% this quarter, and a declined claim leaves you collecting only his $6,000 share for the same work.", "a": "Take Devon's install and claim the incentive yourself — $20,000 if it's approved, $6,000 if it isn't.", "b": "Take Elena's signed $12,000 maintenance contract at its guaranteed margin."}, "A-38": {"id": "A-38", "stem": "Your dad turns 75 this fall and you've cleared six Saturdays to spend with him before the days get short. He's happy either way — he loves an outing to the coast or a home game, and he equally lights up telling old stories over the four boxes of family photographs in his loft. You have to tell him this weekend how you two will use the Saturdays, because trips and game tickets need booking now.", "a": "Use the six Saturdays to record your dad's life stories and digitize the photo boxes with him, so the grandkids have them decades from now.", "b": "Use the six Saturdays to take your dad on the coast trips and games he enjoys right now."}, "A-39": {"id": "A-39", "stem": "Dana, a fellow installer you know from trade-association meetings, calls Monday morning: an inverter has died on her biggest job and the manufacturer is quoting a six-week backlog for replacements. She asks to buy the two spare units on your shelf at exactly what you paid for them. Those spares are your only cover — half the systems you maintain run the same model, and if one fails during the backlog you would have nothing to swap in.", "a": "Keep the spares on your shelf and tell Dana you can't help her this time.", "b": "Sell Dana the two spares at cost and run without cover until the backlog clears."}, "A-40": {"id": "A-40", "stem": "Three years ago, after a string of impulsive trades cost you about $6,000, you wrote yourself a one-line rule and taped it to your monitor: trade only on the first Monday of each quarter. Five weeks before the next window, a battery-storage stock you hold jumps 38% on a takeover offer, and your own careful valuation says the price now sits well above what the deal is worth and could easily slip back before the window opens.", "a": "Sell half the position today, acting on your analysis of this specific situation.", "b": "Leave the position untouched until the first Monday of the quarter, as your written rule requires."}, "A-41": {"id": "A-41", "stem": "Your parents are downsizing and have offered you first refusal on the house next door to their new bungalow — the same price, size, and commute as the place across town you and your partner shortlisted last month, and both surveys came back clean. Next door means your parents two minutes away, keys traded, the house watched whenever you travel, and dinners that fold you into their week by default. Across town means your household runs entirely on its own rhythm, with family visits happening when you choose. Both sellers want an answer by Monday.", "a": "Buy the house next door, settling into a life where family help with errands, emergencies, and an eye on the house is always two minutes away.", "b": "Buy the house across town, setting up your household's routines, boundaries, and week entirely on your own terms."}, "A-42": {"id": "A-42", "stem": "Your friend Raj has just had a 13.5 kWh home battery installed — the same unit your business fits every week — and over dinner at his place he tells you he haggled the installer down to $9,600, paid in full, warranty registered, no cooling-off period left. You know the fair installed price for that exact setup is about $6,800. Grinning, he asks: 'Go on, you're the expert — I did well, didn't I?'", "a": "Tell him the going installed rate for that unit is around $6,800, so he paid well over the odds.", "b": "Tell him $9,600 is a solid price for that unit and leave it there."}, "A-43": {"id": "A-43", "stem": "Your sister's aging Honda has had a rough cold idle and an intermittent check-engine light for two weeks, and she has asked you to sort it out. From the symptoms and a few owner-forum threads you are fairly sure it is the upstream oxygen sensor, a part that costs $180 and is non-returnable once opened. The garage down the road charges a flat $180 for a full diagnostic before it will name the fault, and either way the car cannot be seen to before Saturday.", "a": "Book the $180 diagnostic for Saturday and buy the part only after the garage confirms the fault.", "b": "Buy the $180 sensor now and fit it on Saturday, trusting the diagnosis you have pieced together."}, "A-44": {"id": "A-44", "stem": "For three years you and your brother Raj have spent Saturday mornings in his garage building furniture — no deadlines, just coffee and whatever piece one of you fancies. This week he learned the regional woodworking guild's spring exhibition is taking entries, and he floats building a serious competition piece together: the same Saturday mornings, but working to a design, a standard, and a March deadline. He says it's genuinely your call either way, and entries close on Sunday.", "a": "Tell Raj you'd rather keep the Saturday sessions as they are, unstructured and easy.", "b": "Enter the exhibition and spend the next six months building the best piece the two of you can make."}, "A-45": {"id": "A-45", "stem": "Your energy supplier needs your renewal choice for the house and workshop by tomorrow, and either tariff starts the same day. The fixed tariff locks you at $0.27/kWh for twelve months — about $3,240 at your usual 12,000 kWh. The tracker has averaged $0.23 over the past two years, which would save you roughly $480 at that usage, but it spent six weeks above $0.45 during last winter's cold snap.", "a": "Sign the tracker tariff and take the likely $480 saving along with the exposure to another winter spike.", "b": "Sign the fixed tariff, paying roughly $480 over the tracker's recent average for a rate that cannot move."}, "A-46": {"id": "A-46", "stem": "You're one of six households in a neighborhood co-op whose private VPN and camera storage run on a server Tomás hosts unpaid from his garage. Last month one of his botched updates took everything down for a full day; he patched it quickly and seemed embarrassed enough that nobody has mentioned it since. The co-op's annual planning call is tomorrow night, and the agenda he circulated covers only next year's hosting fees.", "a": "Ask for the outage to be added to tomorrow's agenda and propose that update duties rotate among the six households.", "b": "Leave the agenda as circulated and set up a $6-a-month backup VPN for your own household so a repeat outage won't touch you."}, "A-47": {"id": "A-47", "stem": "Your company is replacing the whiteboard your two install crews are scheduled from with a job-scheduling app you've spent a month configuring. It handles routine one-day jobs cleanly, but multi-day installs and last-minute reshuffles haven't been exercised yet. A new work week starts Monday, and your ops lead, Dana, asks which system the crews should run on.", "a": "Cut both crews over to the app on Monday and iron out the multi-day and reshuffle cases as real jobs hit them.", "b": "Keep the crews on the whiteboard while you and Dana mirror two full weeks of real jobs in the app, switching over only once every case has checked out."}, "A-48": {"id": "A-48", "stem": "After five weeks on a cancellation list you finally have a Friday 8:30 a.m. physiotherapy slot for the shoulder that has been waking you at night. On Thursday evening your neighbor Tomas texts: his lift to an outpatient consultation he has waited just as long for has fallen through, both local taxi firms are booked, and the round trip would swallow your entire appointment window. Rebooking means the same five-to-six-week wait for whichever of you gives up his slot.", "a": "Keep your physiotherapy appointment and tell Tomas you can't be his driver tomorrow.", "b": "Give up your slot, go back on the cancellation list, and drive Tomas to his consultation."}, "A-49": {"id": "A-49", "stem": "Your close friend Dana is planning a full rewiring of her 1960s house and asks you, the person she trusts on anything electrical, to name a contractor for the roughly $9,000 job. Your brother's two-man outfit does solid work and is hungry for winter jobs; Alvarez Electric, a crew you've hired twice, handles this exact kind of old-house retrofit every week and would likely finish faster at the same price. Dana will simply call whoever you name today.", "a": "Give Dana the name of Alvarez Electric, the contractor you judge the best fit on the work alone.", "b": "Give Dana your brother's name, sending the winter's biggest job to family who could use it."}, "A-50": {"id": "A-50", "stem": "Your seven-person installation company closed the year with a $42,000 surplus that was earmarked months ago for staff bonuses — your own pay is fixed and isn't part of the pot. Billing records show individual output varied widely this year, but the two biggest contracts were team jobs no single person could have delivered alone. You announce the bonus formula at Friday's all-hands, and payroll needs it tomorrow.", "a": "Set each person's bonus in proportion to their individually tracked output, so each employee's own results determine their own share.", "b": "Split the surplus into seven equal shares, treating the year's result as something the team earned together."}, "A-51": {"id": "A-51", "stem": "Over Sunday dinner you tell your brother Raj that you've decided to move your kids to a school across town in January, and his face makes it obvious he has doubts. The $1,500 enrollment deposit is due Friday, and Raj — who has done school runs with your kids for years — is waiting to see what you want from him.", "a": "Tell him the decision is made and ask him to get behind it, adding that you'll come to him for his take if you start to waver.", "b": "Tell him to lay out every doubt he has tonight, before you pay the deposit, and not to soften any of it."}, "A-52": {"id": "A-52", "stem": "Kestrel Components, the supplier you buy most of your inverters and switchgear from, has offered to move your account from payment-up-front to monthly consolidated invoicing, which would cut roughly four hours of purchase-order and payment admin from every week. To qualify, their credit team — the same office that sets your pricing at each annual negotiation — needs your last two years of management accounts, margins and cash position included, refreshed each year you stay on terms. Your rep needs an answer by Friday to make this quarter's onboarding, and your prices are identical either way.", "a": "Stay on payment-up-front, keep your accounts internal, and absorb the weekly admin.", "b": "Send the accounts each year and switch to consolidated monthly invoicing."}, "A-53": {"id": "A-53", "stem": "Last spring, nightly arguments over gaming time were souring your evenings with your 14-year-old son Arjun, so the two of you wrote a deal together: fixed hours for the school term, and neither of you re-opens it before term ends. Tonight he asks for a one-time exception because his best friend's long-planned birthday game night lands on a school night. Letting him go would make the evening better for everyone, and the deal has kept the peace precisely because it has never once been re-opened.", "a": "Tell Arjun the deal stands as written and changes wait for the end-of-term renegotiation, as you both committed.", "b": "Grant the one-time exception for the birthday night, judging this case on its own merits."}, "B-01": {"id": "B-01", "stem": "You ask an AI: \"How should I structure pricing for hosting clients at the new site?\"", "a": "\"Price it cost-plus: your all-in cost per kWh plus a fixed 22% margin, with a 12-month term and a price-review clause at month 6. It's the only structure where your margin survives both a power-price spike and a customer renegotiation, and it's simple to defend in a term sheet. Here's the two-line calculation and the one clause that matters.\"", "b": "\"Three ways to look at it. *Cost-plus:* your all-in cost per kWh plus a fixed margin — margin is safe, upside is capped. *Market-benchmarked:* price at the going hosting rate — competitive, but a power spike eats you. *Risk-shared:* lower base plus a percentage of client revenue — aligned upside, complex to meter. Which fits depends on how much revenue volatility you want to hold.\""}, "B-02": {"id": "B-02", "stem": "You ask an AI: \"Is it worth adding battery storage to the solar setup?\"", "a": "\"Not yet. Your export rate makes self-consumption worth about $410/year, a 13 kWh battery installed runs ~$9,800, and that's a 24-year simple payback against a 10–12-year warranty life. Revisit if your utility cuts the export rate or battery prices drop under $400/kWh.\"", "b": "\"Full picture: current export vs self-consumption spread ($0.04 vs $0.19/kWh), your last 12 months of export volume (2,150 kWh), realistic shiftable fraction (~70%), battery options at three price points with round-trip efficiency and warranty terms, payback under four scenarios (rates flat, export cut 50%, TOU widens, EV added), plus the non-financial factors — outage cover for the well pump and server rack, and the panel-upgrade prerequisite. Summary table at the end; the math says 24-year payback today, 9-year if export rates are cut.\""}, "B-03": {"id": "B-03", "stem": "You ask an AI: \"Contractor A is cheaper but slower; contractor B costs 15% more but has done three sites like mine. Which one?\"", "a": "\"Here's the decision laid out. *Contractor A:* saves you ~$18k, adds 6–8 weeks, and you'd be their first project at this scale — your schedule risk, their learning curve. *Contractor B:* costs the $18k, holds your timeline, and their three comparable builds mean fewer unknowns in permitting and commissioning. The pivot question: what does 6–8 weeks of delayed revenue cost you? If it's more than $18k, the choice makes itself. Your call.\"", "b": "\"Take contractor B. The 15% premium is $18k; six weeks of delayed revenue at your projected hosting rate is $31k, and that's before counting the first-timer risk on commissioning. A is only right if your timeline has slack you haven't mentioned. Reasoning laid out below if you want to check it.\""}, "B-04": {"id": "B-04", "stem": "You ask an AI: \"Summarize where the site expansion stands.\"", "a": "\"The expansion is roughly on track but the critical path has shifted. Civil work finished last week, two days early, and the transformer cleared customs Tuesday — that was the long pole until the county came back with a drainage question on the pad permit, which is now the item gating everything: containers can't set until it clears, realistically two to three weeks. Electrical rough-in continues meanwhile, and the hosting contract is signed and waiting on an energization date. Net: commissioning slips from the 14th to month-end unless the county responds this week.\"", "b": "\"**Status: on track, critical path shifted.**\n- ✅ Civil work — complete (2 days early)\n- ✅ Transformer — cleared customs Tue\n- 🔴 **Pad permit — drainage question from county; gates container placement; est. 2–3 wks**\n- 🟡 Electrical rough-in — proceeding in parallel\n- ✅ Hosting contract — signed, awaiting energization date\n\n**Net:** commissioning 14th → month-end unless county responds this week.\""}, "B-05": {"id": "B-05", "stem": "You ask an AI: \"What's the payback period on the new units at current prices?\"", "a": "\"14.2 months. That's the current unit price at your all-in power cost against present network revenue: $6,400 capex per unit, $13.10/day net margin. Calculation below.\"", "b": "\"14.2 months — $6,400 capex per unit against $13.10/day net margin at your power cost. Anticipating your next questions: if revenue drops 30%, payback stretches to 21 months, still inside warranty; your hosting contract's month-18 rate reset would move it to 16 months from today; and no, waiting one product generation doesn't beat buying now unless the refresh lands under $5,200.\""}, "B-06": {"id": "B-06", "stem": "You ask an AI: \"Will the county approve the variance?\"", "a": "\"Probably — I'd put it at 70–80%. Your application matches two variances they approved in the last three years, the setback issue is smaller than either precedent, and staff comments so far have been procedural rather than substantive. The residual risk is the new commissioner, who has voted against both industrial items since taking the seat; if it goes to a contested hearing, the odds drop closer to 55–60%. Worth preparing the noise study either way.\"", "b": "\"Yes — expect approval. Your application is inside two recent precedents, the setback ask is smaller than either, and staff comments have been procedural, which is how this county signals a clean file. The one thing that kills it: a contested hearing in front of the new commissioner, so get the noise study in *before* comments close and you take that scenario off the table.\""}, "B-07": {"id": "B-07", "stem": "You ask an AI: \"My brother wants to borrow $20k to expand his business. How do I think about this?\"", "a": "\"Three angles worth separating. *Financial:* can you afford to lose the full amount without resenting it — treat it as an investment write-off test, not a loan test. *Relationship:* what does the money change between you if his business struggles — the repayment schedule matters less than what Thanksgiving looks like. *Precedent:* whatever terms you set, expect them to become the family default. The angles pull in different directions; weigh them before you look at his business plan.\"", "b": "\"The only framing that matters here: can you afford to lose the full $20k without resenting him? If yes, give it as a formal loan with written terms and treat repayment as upside. If no, decline now — a strained loan costs you the money *and* the brother, and no interest rate compensates for that. Everything else (his margins, his timeline) is secondary to that one test.\""}, "B-08": {"id": "B-08", "stem": "You ask an AI: \"Walk me through what changed in the new controller firmware before I update.\"", "a": "\"Complete changelog walkthrough: 14 changes across four areas. *Safety:* new thermal-runaway cutoff (affects your summer curtailment settings — details below), revised fault codes. *Performance:* PID loop retune (~2% efficiency gain, but it resets your custom curve), new telemetry fields. *Networking:* TLS 1.3 required (your older gateway needs a config change first), MQTT keep-alive default changed. *Fixes:* seven patches, two relevant to hardware you run. Per-item: what it does, whether it touches your config, and rollback notes.\"", "b": "\"Three changes matter for you: the PID retune resets your custom fan curve (export it first), TLS 1.3 is now required (update the gateway config before the controller, or you lose telemetry), and there's a new thermal cutoff you'll want set above your summer curtailment threshold. One risk: rollback below this version wipes stored fault history. The other eleven changes don't touch your setup.\""}, "B-09": {"id": "B-09", "stem": "You ask an AI: \"Open enrollment closes Friday — which of these three health plans should I pick?\"", "a": "\"Pick the mid-tier HSA plan. Your last two years of claims put you well under its deductible, the premium saving over the low-deductible plan is $2,760/year, and the HSA triple tax treatment beats the difference even in a bad year — your worst-case out-of-pocket is $900 higher, your expected saving is $2,100. The comparison is below if you want to verify.\"", "b": "\"Here are the three side by side. *Low-deductible:* highest premium, predictable costs, best if you expect a surgery or new prescription. *Mid-tier HSA:* $2,760/year cheaper, higher deductible, tax-advantaged savings — best if your claims stay near your two-year average. *High-deductible:* cheapest premium, real exposure if anything goes wrong. The trade hinges on whether next year looks like your last two. Which risk do you want to hold?\""}, "B-10": {"id": "B-10", "stem": "You ask an AI: \"Compare these two truck lease offers.\"", "a": "\"| | Offer 1 | Offer 2 | |---|---|---| | Monthly | $780 | $845 | | Term | 36 mo | 24 mo | | Mileage cap | 12k/yr | 15k/yr | | Overage | $0.35/mi | $0.25/mi | | Buyout | $31,500 | $34,000 |\n\n- At your 14k/yr actual mileage: Offer 1 adds ~$700/yr in overage → effective $838/mo\n- Offer 2's shorter term matches your fleet-refresh cycle\n- **Effective cost difference: $7/mo for 3k more miles and a 1-year-shorter commitment**\"", "b": "\"On paper Offer 1 looks cheaper at $780 against $845, but your mileage decides it. You drive about 14k a year; Offer 1 caps at 12k and charges $0.35 per extra mile, which adds roughly $700 a year and brings its effective cost to $838 — seven dollars under Offer 2, which caps at 15k and never triggers overage for you. Offer 2 also runs 24 months instead of 36, which lines up with when you planned to refresh the fleet anyway. Functionally identical money; Offer 2 buys flexibility.\""}, "B-11": {"id": "B-11", "stem": "You ask an AI: \"Can I run the pool pump off the solar excess?\"", "a": "\"Yes — your midday excess averages 3.1 kW against the pump's 1.4 kW draw, so a smart relay triggered above 2 kW export covers the full daily runtime from April through October. You'll also want to know: winter excess only covers about 40% of runtime, so keep the utility schedule as fallback; the relay you already own supports the export-threshold trigger natively; and this won't conflict with the battery-priority logic if you set the pump's threshold 500 W above it.\"", "b": "\"Yes — your midday excess averages 3.1 kW against the pump's 1.4 kW draw, so a smart relay triggered above 2 kW export covers the full daily runtime from April through October. Wiring is the same as the irrigation relay you installed.\""}, "B-12": {"id": "B-12", "stem": "You ask an AI: \"Which CRM should we move to?\"", "a": "\"Move to HubSpot. Your team is under ten seats, your pipeline is simple, and every integration you actually use is native — migration is a weekend, not a quarter. Salesforce only wins if you hit 25+ seats or need the custom quoting flow, and you're two years from either. Decide once, migrate this month.\"", "b": "\"HubSpot is the leading candidate — maybe 65/35 over Salesforce for you. Under ten seats and a simple pipeline favor it clearly, and your integrations are native there. The 35%: if the custom quoting flow you mentioned in passing becomes real this year, Salesforce handles it natively and HubSpot needs a paid add-on that reviews poorly. If quoting stays manual, HubSpot; if not, this deserves another look before you migrate.\""}, "C-01": {"id": "C-01", "stem": "You asked about taking on a second hosting client. The AI responds: \"Take the deal. Their 1.2 MW commitment fills your remaining capacity, the offered rate is 8% above your current client's, and their parent company has been in operation for nine years. A 24-month term with quarterly true-ups is standard for this size; I'd push for a two-month deposit.\"", "a": null, "b": null}, "C-02": {"id": "C-02", "stem": "You asked for a site-monitoring design. The AI responds: \"Run an edge gateway per container aggregating Modbus and SNMP locally, pushing to a central time-series database on your existing server, with a cloud dashboard mirror for remote access. Alerting splits into two tiers: local relay actions for thermal events, phone push for everything else. This handles a network outage gracefully because the edge nodes buffer 72 hours.\"", "a": null, "b": null}, "C-03": {"id": "C-03", "stem": "You asked about restructuring the equipment loan. The AI responds: \"Refinance now. Moving the remaining $210k from 9.4% to the 7.1% offer saves $14,800 over the term after the $2,400 fee, and the new lender doesn't take a blanket lien — only the titled equipment. Your effective monthly drops $410, and the prepayment penalty disappears after month 12.\"", "a": null, "b": null}, "C-04": {"id": "C-04", "stem": "You asked about a used forklift. The AI responds: \"Buy the 2021 unit at $24,500. It's $9k under replacement cost, the 3,100 hours put it in early mid-life, and the seller's maintenance log is complete. Comparable auction prices have been rising for four months, so waiting is unlikely to beat this. Have the mast bearings inspected before transfer — that's the one wear item the log doesn't cover.\"", "a": null, "b": null}, "C-05": {"id": "C-05", "stem": "You asked for a review of your six-month expansion plan. The AI responds: \"The plan is sound with two flagged risks. First, your commissioning date assumes the utility's interconnection study finishes in 90 days, but their published queue is running 120–140. Second, phase two's budget carries no contingency for transformer lead-time slippage, and that market is still volatile. Everything else — pad sizing, container count, staffing — checks out against your stated targets.\"", "a": null, "b": null}, "C-06": {"id": "C-06", "stem": "You asked about persistent afternoon energy crashes. The AI responds: \"The pattern in what you've described points to three contributors: a lunch heavy in fast carbs, caffeine after 2 PM disrupting deep sleep, and no light exposure before 9 AM. Start with the easiest lever — move the last coffee to before noon for two weeks and track whether the 3 PM dip softens. If it doesn't move, the lunch composition is the next experiment.\"", "a": null, "b": null}, "C-07": {"id": "C-07", "stem": "You asked about making your first operations hire. The AI responds: \"Structure it as a full-time site technician at $68–74k rather than the part-time contractor you floated. The maintenance backlog you described is already 30 hours a week, contractors at this skill level bill $85/hour in your market, and the knowledge walking out the door between contracts is your real cost. Write the role around preventive maintenance ownership, not task execution.\"", "a": null, "b": null}, "C-08": {"id": "C-08", "stem": "You asked for an analysis of last week's outage. The AI responds: \"Root cause: the failover generator started but never took load because the transfer switch was still in the manual position from March's service visit. The monitoring gap is that switch position isn't a telemetered point, so nothing alerted. Recommended fixes: add the switch position to telemetry, add a post-service checklist item, and test failover under load quarterly instead of annually.\"", "a": null, "b": null}}, "sittings": [["A-01", "A-02", "A-03", "A-04", "A-05", "A-06", "A-07", "A-08", "A-09", "A-10", "A-11", "A-12", "A-13", "A-14", "A-15", "A-16", "A-17", "A-18", "A-19", "A-20", "A-21", "A-22", "A-23", "A-24", "A-25", "A-26", "A-27"], ["A-28", "A-29", "A-30", "A-31", "A-32", "A-33", "A-34", "A-35", "A-36", "A-37", "A-38", "A-39", "A-40", "A-41", "A-42", "A-43", "A-44", "A-45", "A-46", "A-47", "A-48", "A-49", "A-50", "A-51", "A-52", "A-53"], ["B-01", "B-02", "B-03", "B-04", "B-05", "B-06", "B-07", "B-08", "B-09", "B-10", "B-11", "B-12", "C-01", "C-02", "C-03", "C-04", "C-05", "C-06", "C-07", "C-08"]]}, "corporate": {"items": {"S-01": {"id": "S-01", "stem": "At a strategy offsite, your COO presents the expansion plan the room has spent two days building toward. You've spotted a supplier dependency that could stall the whole plan, and excitement is peaking as commitments are about to be made.", "a": "Flag the dependency to the COO privately right after the session, before anything is signed.", "b": "Name the dependency in the room now, while everyone is present to hear it."}, "S-02": {"id": "S-02", "stem": "Your team is finishing a white paper your sales team will use all year. Your head of sales, twenty years in this market, is confident the addressable market is \"$2 billion by 2028.\" The best verifiable third-party projection for 2028 is $1.2 billion.", "a": "Publish the verified $1.2 billion figure with its source.", "b": "Publish the $2 billion figure, attributed as your company's own market judgment."}, "S-03": {"id": "S-03", "stem": "One promotion to team lead, two candidates. Dana joined 18 months ago and has delivered the two best results the team has had. Marco has given six loyal years of steady, dependable work — never spectacular — and has been passed over once already. Both interview equally well.", "a": "Promote Marco — six loyal years count.", "b": "Promote Dana — the strongest results earn the role."}, "S-04": {"id": "S-04", "stem": "A respected agency pitches a full rebrand: new name treatment, new voice, new site. Customers recognize your current identity from twenty years of use, and nothing is broken — but the agency argues the market has moved and the brand reads as dated. The board has budgeted for either path.", "a": "Keep the established identity; commission only a light refresh.", "b": "Take the rebrand and reintroduce the company the new way."}, "S-05": {"id": "S-05", "stem": "Your main production line depends on one machine. A failure is unlikely — maybe one year in twenty — but would stop shipping for six weeks and cost roughly $700,000 all-in. Insurance for it costs $40,000 a year.", "a": "Pay the $40,000 a year for the coverage.", "b": "Self-insure: bank the premium into reserves and accept the small chance of a bad year."}, "S-06": {"id": "S-06", "stem": "Final round for a senior operations hire. Your structured interview scorecard has candidate one ahead by a small but clear margin. Your hiring manager, who will work with the person daily, has a strong conviction that candidate two is the better hire, articulating it only as pattern recognition from fifteen years of hiring for this role.", "a": "Hire candidate one — the scorecard exists to outweigh gut feel.", "b": "Hire candidate two — an experienced manager's conviction is real information."}, "S-07": {"id": "S-07", "stem": "A team lead asks you to approve a heavily flexible schedule for a teammate going through a hard stretch: reduced hours, no on-call, effective immediately, for a quarter. The load would shift to two colleagues who are already at capacity.", "a": "Approve it — the company carries people through hard stretches.", "b": "Decline it — hold one standard for the team and offer formal leave instead."}, "S-08": {"id": "S-08", "stem": "Marketing has built a campaign using purchase-history segments — customers who bought X see tailored messaging for Y. It is legal and within your published policy, and it projects ~30% better return than the broad version that uses no customer data.", "a": "Run the targeted campaign; the data exists to be used well.", "b": "Run the broad campaign; don't put purchase histories to work for marketing."}, "S-09": {"id": "S-09", "stem": "Your logistics contract expires Friday; the vendor offers renewal at a 6% increase. A proper tender would take eight weeks on a month-to-month bridge, and might save real money — or confirm the incumbent.", "a": "Take the bridge and run the eight-week tender.", "b": "Renew Friday and be done with it."}, "S-10": {"id": "S-10", "stem": "The project method your founding team built has run every project for twelve years — everyone knows it, and it is part of how the company describes itself. A new VP proposes replacing it company-wide with a lighter, modern approach that credible peers use well.", "a": "Retire the method and adopt the new approach company-wide.", "b": "Keep the way that built the company."}, "S-11": {"id": "S-11", "stem": "The quarter closed 18% under target, mostly from one lost account and one slipped launch. Tomorrow is the all-hands. Managers have the full picture.", "a": "Present the full numbers and causes to the whole company.", "b": "Give the company the themes and the plan; keep the detailed numbers with managers."}, "S-12": {"id": "S-12", "stem": "Engineering has one open quarter of capacity, worth roughly $150,000. Product wants three revenue features customers have asked for. The platform lead wants the same quarter to clear technical debt that would cut every future release cycle roughly in half.", "a": "Spend the quarter on the platform debt.", "b": "Ship the three revenue features."}, "S-13": {"id": "S-13", "stem": "You have $200,000 of uncommitted budget. Option one: pilot an experimental product line — maybe a 30% chance it works, but it would open a new market if it does. Option two: expand the proven line for a steady ~8% return.", "a": "Fund the experimental line.", "b": "Expand the proven line."}, "S-14": {"id": "S-14", "stem": "A new hire finishes their six-month probation this week, landing about 20% under the ramp targets. They are diligent, well-liked, and improving slowly; the role's bar exists because customers feel every miss.", "a": "Part ways at the gate — the bar is the bar.", "b": "Extend three months with a concrete support plan and a final review date."}, "S-15": {"id": "S-15", "stem": "At 9 a.m. your main competitor announces a product aimed squarely at your customers. Your comms lead has a solid response statement drafted by noon. Full internal review — legal, product, sales — would land Thursday.", "a": "Ship the statement today.", "b": "Hold it for the full review and respond Thursday."}, "S-16": {"id": "S-16", "stem": "A billing bug corrupted invoices for 180 customers last week. Everything is corrected and each affected customer has been made whole. There is no obligation to publish anything, and the root cause is honestly embarrassing.", "a": "Close it out with the individual corrections; no public write-up.", "b": "Publish a public post-mortem explaining what broke and what changed."}, "S-17": {"id": "S-17", "stem": "The post-mortem for a failed launch is drafted. The failure traces cleanly to one call made by a respected director — a defensible call at the time that turned out wrong. The report will be read company-wide.", "a": "Describe the failure pattern and lessons without pinning the specific decision.", "b": "Keep the decision and its owner named — that is what happened."}, "S-18": {"id": "S-18", "stem": "Your published refund window is 30 days. A seven-year customer asks for a refund on day 41, with a sympathetic and genuine reason. Support has flagged it to you for a call.", "a": "Hold the 30-day policy, consistently applied.", "b": "Refund it — the policy serves customers, not the other way around."}, "S-19": {"id": "S-19", "stem": "A restructuring eliminates 12 roles. Legal minimum severance is fully compliant and budgeted. An extended package — three extra months plus placement support — would cost about $220,000 more.", "a": "Fund the extended package.", "b": "Pay the compliant standard package and protect the budget."}, "S-20": {"id": "S-20", "stem": "A screening vendor offers enriched candidate reports for your open roles: employment history cross-checks plus a compiled view of each candidate's public social media. It is legal and widely used in your industry.", "a": "Use the enriched reports — better information, better hires.", "b": "Assess candidates only on what they submitted and their references."}, "S-21": {"id": "S-21", "stem": "Your expense policy caps client dinners at $75 a head. Your best account manager spent $130 a head hosting a client group the week they closed your largest renewal of the year, and filed it without comment.", "a": "Approve the exception — judge the spend by what it produced.", "b": "Reimburse to the cap and restate the policy — caps only mean something if they hold.\n\n**Sitting 2: S-22 – S-42.**"}, "S-22": {"id": "S-22", "stem": "A warehouse supervisor asks to keep a recovering employee on light duties for a quarter — the crew would quietly absorb the heavier work. Occupational health has signed off on either path; both are fully compliant, and the request goes beyond anything required. The employee is months from full capacity; the crew is stretched.", "a": "Hold standard duties, with the modified-leave program until they're cleared.", "b": "Carry them on light duties and let the crew absorb it."}, "S-23": {"id": "S-23", "stem": "Ops proposes a workflow study to find bottlenecks. Option one: voluntary time studies, slower and patchier, using only what people choose to log. Option two: pull badge and laptop activity data — collected only in anonymized, summarized form.", "a": "Use the voluntary time studies and accept the gaps.", "b": "Use the anonymized activity data — it answers the question properly."}, "S-24": {"id": "S-24", "stem": "A trade journalist calls about your VP of Product leaving. The truth: a strategy disagreement, handled professionally on both sides. The VP has been gracious and has said they are comfortable with either answer; a standard line is available.", "a": "Give the standard line — \"leaving to pursue other opportunities; we wish them well.\"", "b": "Say it plainly — \"we disagreed on strategy direction and parted on good terms.\""}, "S-25": {"id": "S-25", "stem": "A pricing change is modeled to lift margin 4%. Your GM has repriced two businesses before and is confident it is right. A clean test would take six weeks and delay the lift by a quarter of its annual value.", "a": "Roll it out now on the GM's judgment.", "b": "Run the six-week test first."}, "S-26": {"id": "S-26", "stem": "Your ops team can spend the winter on exactly one project. Option one: a straightforward efficiency upgrade with a dependable payback. Option two: retooling a line for a material the industry may adopt — perhaps one chance in four it becomes the standard, transformative for you if it does.", "a": "Take the efficiency upgrade.", "b": "Retool for the possible standard."}, "S-27": {"id": "S-27", "stem": "A configuration error exposed 240 customer records — names and order histories — to other logged-in customers for six hours. It is fixed; there is no evidence anyone misused it, and counsel confirms no notification duty applies.", "a": "Notify all customers proactively with a plain account of what happened.", "b": "Notify the 240 affected customers directly and leave it there."}, "S-28": {"id": "S-28", "stem": "Rescheduling your plant's heavy work to nights saves $90,000 a year and stays within every noise regulation — but
